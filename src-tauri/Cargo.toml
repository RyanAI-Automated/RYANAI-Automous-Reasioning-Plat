[package]
name = "ryan-app"
version = "0.1.0"
description = "RyanAI Autonomous Reasoning Platform"
authors = ["Ntsiyeni Ganyane"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-http = "2.8.3"
tauri-plugin-log = "2.10.1"
tauri-plugin-shell = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
reqwest = { version = "0.11", features = ["json", "multipart"] }
tokio = { version = "1.0", features = ["full"] }

[profile.dev]
debug = 1
