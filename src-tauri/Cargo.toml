tauri-build = "3.0.0-alpha.4"
[package]
name = "ryan-app"
version = "0.1.0"
description = "RyanAI Autonomous Reasoning Platform"
authors = ["Ntsiyeni Ganyane"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
reqwest = { version = "0.11", features = ["json", "multipart"] }
tokio = { version = "1.0", features = ["full"] }
sysinfo = "0.30"

[profile.dev]
# Re-enable debug symbols for development diagnostics and backtraces
debug = 1
