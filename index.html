    <!-- MERGED INLINE MAIN APPLICATION SCRIPT -->
    <script type="text/babel" data-presets="react,typescript">
      const APP_VERSION = '4.5.0-matrix';
      const API_BASE_URL = window.location.origin;

      class RyanAIClient {
        constructor(baseURL, version) {
          this.baseURL = baseURL;
          this.version = version;
        }

        async request(endpoint, options = {}) {
          const url = `${this.baseURL}${endpoint}`;
          try {
            const response = await fetch(url, {
              ...options,
              headers: {
                'Content-Type': 'application/json',
                'X-App-Version': this.version,
                ...options.headers,
              },
            });
            if (!response.ok) throw new Error(`API Error: ${response.status}`);
            return await response.json();
          } catch (error) {
            console.warn(`API Request fallback mode for ${endpoint}`);
            return { status: 'offline', endpoint };
          }
        }

        async healthCheck() {
          return { status: 'healthy', timestamp: new Date().toISOString() };
        }
      }

      const apiClient = new RyanAIClient(API_BASE_URL, APP_VERSION);
      window.ryanai = { client: apiClient, version: APP_VERSION, apiUrl: API_BASE_URL };

      // Root App Component
      const App = () => {
        const [activeTab, setActiveTab] = React.useState('reasoning');

        React.useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [activeTab]);

        return (
          <div class="min-h-screen flex flex-col">
            {/* Header */}
            <header class="border-b border-slate-800 bg-[#0f172a]/90 backdrop-blur-md sticky top-0 z-50">
              <div class="max-w-[1920px] mx-auto px-4 py-2.5 flex items-center justify-between gap-4">
                <div class="flex items-center space-x-3.5">
                  <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 via-purple-600 to-indigo-700 p-0.5 shadow-lg shadow-cyan-500/20">
                    <div class="w-full h-full bg-[#0b0f19] rounded-[10px] flex items-center justify-center">
                      <i data-lucide="cpu" class="w-5 h-5 text-cyan-400"></i>
                    </div>
                  </div>
                  <div>
                    <h1 class="font-orbitron font-bold text-lg tracking-wider text-cyan-400">
                      RYAN<span class="text-white">AI</span>
                    </h1>
                    <p class="text-xs text-slate-400">by <strong class="text-cyan-300">Ntsiyeni Ganyane</strong></p>
                  </div>
                </div>

                <div class="flex items-center space-x-2 text-xs font-mono">
                  <span class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-cyan-300">
                    Model: Ryan-R1-Reasoning
                  </span>
                  <span class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-emerald-400">
                    Agent: ONLINE
                  </span>
                </div>
              </div>

              {/* Navigation */}
              <div class="border-t border-slate-800 bg-[#0b0f19]/90 px-4">
                <div class="max-w-[1920px] mx-auto flex items-center space-x-2 text-sm font-medium py-2">
                  <button 
                    onClick={() => setActiveTab('reasoning')}
                    class={`px-4 py-2 rounded-lg transition-all ${activeTab === 'reasoning' ? 'bg-cyan-950/50 text-cyan-400 border border-cyan-800/50' : 'text-slate-400 hover:text-slate-200'}`}
                  >
                    Reasoning Engine
                  </button>
                  <button 
                    onClick={() => setActiveTab('editor')}
                    class={`px-4 py-2 rounded-lg transition-all ${activeTab === 'editor' ? 'bg-cyan-950/50 text-cyan-400 border border-cyan-800/50' : 'text-slate-400 hover:text-slate-200'}`}
                  >
                    Developer Workspace
                  </button>
                </div>
              </div>
            </header>

            {/* Main Area */}
            <main class="flex-grow max-w-[1920px] w-full mx-auto p-6 space-y-6">
              {activeTab === 'reasoning' ? (
                <div class="glass-panel rounded-2xl p-6 border border-slate-800 space-y-4">
                  <h2 class="font-orbitron font-bold text-lg text-slate-100 flex items-center gap-2">
                    <i data-lucide="bot" class="w-5 h-5 text-cyan-400"></i>
                    Autonomous Task Synthesis
                  </h2>
                  <textarea 
                    rows={4}
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 font-mono text-sm text-slate-100 focus:outline-none focus:border-cyan-400"
                    defaultValue="Synthesize an autonomous distributed lock manager with Redis fallback, real-time deadlock detection, and fault-tolerant telemetry monitoring."
                  />
                  <div class="flex justify-end">
                    <button class="px-6 py-2.5 bg-gradient-to-r from-cyan-500 to-emerald-500 text-slate-950 font-bold rounded-xl shadow-lg shadow-cyan-500/20">
                      Launch Autonomous Loop
                    </button>
                  </div>
                </div>
              ) : (
                <div class="glass-panel rounded-2xl p-6 border border-slate-800">
                  <h2 class="font-orbitron font-bold text-lg text-slate-100">Developer Workspace Active</h2>
                </div>
              )}
            </main>
          </div>
        );
      };

      // Mount App
      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      }
    </script>
