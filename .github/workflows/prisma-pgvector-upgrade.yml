name: Disposable Prisma and pgvector Upgrade Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-pgvector-upgrade:
    name: Upgrade legacy pgvector database safely (${{ matrix.legacy_session_column }})
    strategy:
      fail-fast: false
      matrix:
        legacy_session_column: [unquoted, quoted]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ryanai_migration
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: ryanai_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ryanai_migration -d ryanai_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ryanai_migration:disposable_ci_password@127.0.0.1:5432/ryanai_migration_test
      RYANAI_DISPOSABLE_MIGRATION_DB: 'true'
      RYANAI_LEGACY_SESSION_COLUMN: ${{ matrix.legacy_session_column }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply the non-vector migration history to the disposable database
        run: |
          set -euo pipefail
          cp -a prisma/migrations /tmp/prisma-migrations-full
          restore_migrations() {
            rm -rf prisma/migrations
            cp -a /tmp/prisma-migrations-full prisma/migrations
          }
          trap restore_migrations EXIT
          # First migrate a clean database through all non-vector migrations.
          # Then recreate the legacy Compose-created pgvector objects before
          # applying the new ordered vector migrations.
          rm -rf prisma/migrations/20261104100000_vector_memory
          rm -rf prisma/migrations/20261104120000_agent_memory_session_id
          npx prisma migrate deploy
          restore_migrations
          trap - EXIT
      - name: Recreate the legacy Docker pgvector bootstrap after Prisma baseline
        run: node scripts/test-legacy-pgvector-upgrade.mjs prepare
      - name: Apply vector-memory and compatibility migrations
        run: npx prisma migrate deploy
      - name: Verify legacy data survived the migration
        run: node scripts/test-legacy-pgvector-upgrade.mjs verify
      - name: Run read-only migration and schema readiness audit
        run: npm run db:migration:audit
      - name: Confirm a second deploy is a no-op
        run: npx prisma migrate deploy
      - name: Re-run read-only migration and schema readiness audit
        run: npm run db:migration:audit
