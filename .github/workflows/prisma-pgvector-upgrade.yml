name: Disposable Prisma and pgvector Upgrade Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-pgvector-upgrade:
    name: Upgrade legacy pgvector database safely (${{ matrix.legacy_session_column }})
    strategy:
      fail-fast: false
      matrix:
        legacy_session_column: [unquoted, quoted]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ryanai_migration
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: ryanai_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ryanai_migration -d ryanai_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ryanai_migration:disposable_ci_password@127.0.0.1:5432/ryanai_migration_test
      RYANAI_DISPOSABLE_MIGRATION_DB: 'true'
      RYANAI_LEGACY_SESSION_COLUMN: ${{ matrix.legacy_session_column }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Prepare the minimal Supabase Auth compatibility surface
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/prepare-disposable-supabase-auth-fixture.sql
      - name: Apply the historical eight-migration database baseline
        run: |
          set -euo pipefail
          baseline=/tmp/ryanai-prisma-baseline
          mkdir -p "$baseline/migrations"
          cp prisma/schema.prisma "$baseline/schema.prisma"
          cp prisma/migrations/migration_lock.toml "$baseline/migrations/migration_lock.toml"
          for migration in \
            20261015081513_init_reasoning_platform \
            20261030120000_agent_operations \
            20261030130000_brain_knowledge \
            20261030130500_agent_task_queue \
            20261030153000_agent_run_retry_backoff \
            20261101110000_communications_and_langgraph_checkpoint \
            20261101111500_complete_supabase_models \
            20261102123000_supabase_auth_identity_bridge; do
            cp -a "prisma/migrations/$migration" "$baseline/migrations/"
          done
          npx prisma migrate deploy --schema "$baseline/schema.prisma"
      - name: Recreate the legacy Docker pgvector bootstrap after Prisma baseline
        run: node scripts/test-legacy-pgvector-upgrade.mjs prepare
      - name: Apply vector-memory and compatibility migrations
        run: npx prisma migrate deploy
      - name: Verify legacy data survived the migration
        run: node scripts/test-legacy-pgvector-upgrade.mjs verify
      - name: Run read-only migration and schema readiness audit
        run: npm run db:migration:audit
      - name: Confirm a second deploy is a no-op
        run: npx prisma migrate deploy
      - name: Re-run read-only migration and schema readiness audit
        run: npm run db:migration:audit
