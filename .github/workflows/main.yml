name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify Node and npm versions
        run: |
          node --version
          npm --version
          node -e "const v = process.versions.node.split('.').map(Number); if (v[0] < 22 || (v[0] === 22 && v[1] < 12)) process.exit(1)"

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate application and workflows
        run: npm run validate

      - name: Verify production build output
        run: test -s dist/index.html

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryanai-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
