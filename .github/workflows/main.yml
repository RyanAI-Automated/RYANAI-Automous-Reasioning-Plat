  dependencies:
    name: Check Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Required to upload the SARIF results to the GitHub Security tab
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Required for pnpm workspaces
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 

      # Runs your custom script to bypass raw node_modules
      - name: Run Trivy Scan Script
        run: ./scripts/run-trivy.sh

      # Uploads the generated file to GitHub
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install
          elif [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Audit dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm audit --audit-level high || true
          else
            npm audit --audit-level=high || true
          fi
