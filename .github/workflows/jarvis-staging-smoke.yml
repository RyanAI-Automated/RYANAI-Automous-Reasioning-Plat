name: Jarvis Staging Bridge Smoke

on:
  workflow_dispatch:
    inputs:
      publish_staging_stack:
        description: Publish the non-secret staging stack manifest to Jarvis.
        required: true
        type: boolean
        default: false
      submit_test_patch:
        description: Submit a harmless test candidate to the Jarvis staging review queue.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jarvis-staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify authenticated staging endpoints
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JARVIS_SYNC_ENABLED: 'true'
      JARVIS_ALLOW_PRODUCTION_SYNC: 'false'

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Require staging secrets without printing them
        env:
          JARVIS_BASE_URL: ${{ secrets.JARVIS_STAGING_BASE_URL }}
          JARVIS_API_TOKEN: ${{ secrets.JARVIS_STAGING_API_TOKEN }}
          RYANAI_STAGING_API_BASE_URL: ${{ secrets.RYANAI_STAGING_API_BASE_URL }}
          JARVIS_INGRESS_TOKEN: ${{ secrets.JARVIS_STAGING_INGRESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JARVIS_BASE_URL" || { echo "Missing JARVIS_STAGING_BASE_URL secret"; exit 1; }
          test -n "$JARVIS_API_TOKEN" || { echo "Missing JARVIS_STAGING_API_TOKEN secret"; exit 1; }
          test -n "$RYANAI_STAGING_API_BASE_URL" || { echo "Missing RYANAI_STAGING_API_BASE_URL secret"; exit 1; }
          test -n "$JARVIS_INGRESS_TOKEN" || { echo "Missing JARVIS_STAGING_INGRESS_TOKEN secret"; exit 1; }

      - name: Enforce HTTPS-only staging origins
        env:
          JARVIS_BASE_URL: ${{ secrets.JARVIS_STAGING_BASE_URL }}
          RYANAI_STAGING_API_BASE_URL: ${{ secrets.RYANAI_STAGING_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const targets = [
            ['Jarvis staging', process.env.JARVIS_BASE_URL],
            ['RyanAI staging', process.env.RYANAI_STAGING_API_BASE_URL],
          ];
          for (const [label, value] of targets) {
            let url;
            try { url = new URL(value); } catch { throw new Error(label + ' URL is invalid'); }
            if (url.protocol !== 'https:') throw new Error(label + ' must use HTTPS');
            if (url.username || url.password || url.search || url.hash) {
              throw new Error(label + ' must not include credentials, a query string, or a fragment');
            }
            if (url.pathname !== '/') throw new Error(label + ' must be an origin URL without a path');
            if (url.hostname === 'localhost' || url.hostname.endsWith('.localhost') ||
                url.hostname === '127.0.0.1' || url.hostname === '[::1]') {
              throw new Error(label + ' must point to a reachable staging host, not loopback');
            }
            console.log('PASS ' + label + ' uses HTTPS origin (' + url.hostname + ')');
          }
          NODE

      - name: Verify outbound Jarvis bearer authentication
        env:
          JARVIS_BASE_URL: ${{ secrets.JARVIS_STAGING_BASE_URL }}
          JARVIS_API_TOKEN: ${{ secrets.JARVIS_STAGING_API_TOKEN }}
          JARVIS_SYNC_ENABLED: 'true'
          JARVIS_ALLOW_PRODUCTION_SYNC: 'false'
        run: npm run jarvis:status

      - name: Publish staging stack manifest
        if: inputs.publish_staging_stack
        env:
          JARVIS_BASE_URL: ${{ secrets.JARVIS_STAGING_BASE_URL }}
          JARVIS_API_TOKEN: ${{ secrets.JARVIS_STAGING_API_TOKEN }}
          JARVIS_SYNC_ENABLED: 'true'
          JARVIS_ALLOW_PRODUCTION_SYNC: 'false'
        run: npm run jarvis:publish-stack -- staging main "$GITHUB_SHA"

      - name: Submit harmless staging candidate
        if: inputs.submit_test_patch
        env:
          JARVIS_BASE_URL: ${{ secrets.JARVIS_STAGING_BASE_URL }}
          JARVIS_API_TOKEN: ${{ secrets.JARVIS_STAGING_API_TOKEN }}
          JARVIS_SYNC_ENABLED: 'true'
          JARVIS_ALLOW_PRODUCTION_SYNC: 'false'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const runId = process.env.GITHUB_RUN_ID;
          const patch = {
            title: `Jarvis staging bridge smoke test #${runId}`,
            targetPath: 'docs/JARVIS_STAGING_SMOKE.md',
            patchContent: `<!-- Jarvis staging smoke candidate ${runId}; do not merge. -->\n`,
            branch: `staging-smoke/${runId}`,
            baseBranch: 'main',
            requestedBy: 'github-actions-staging-smoke',
          };
          writeFileSync(process.env.RUNNER_TEMP + '/jarvis-staging-patch.json', JSON.stringify(patch));
          NODE
          npm run jarvis:submit-patch -- "$RUNNER_TEMP/jarvis-staging-patch.json"

      - name: Verify inbound RyanAI bearer authentication without changing files
        env:
          RYANAI_STAGING_API_BASE_URL: ${{ secrets.RYANAI_STAGING_API_BASE_URL }}
          JARVIS_INGRESS_TOKEN: ${{ secrets.JARVIS_STAGING_INGRESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base="${RYANAI_STAGING_API_BASE_URL%/}"
          response_file="$RUNNER_TEMP/jarvis-ingress-response.json"
          status="$(curl --silent --show-error --max-time 15 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST "$base/api/jarvis/patches/apply" \
            --header "Authorization: Bearer $JARVIS_INGRESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}')"
          if [[ "$status" != "400" ]]; then
            echo "Expected authenticated route to reject the intentionally empty body with HTTP 400; got HTTP $status."
            echo "HTTP 401/404/503 indicates an authentication, route, or configuration problem."
            exit 1
          fi
          echo "PASS inbound Jarvis token was accepted; the empty body was rejected before patch processing."
