name: Secret Scanning (TruffleHog)

on:
  push: {}
  pull_request: {}

permissions:
  contents: read


jobs:
  secret-scan:
    name: TruffleHog secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@v3.99.7
        with:
          extra_args: --results=verified,unknown
