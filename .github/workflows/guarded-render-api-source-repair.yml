name: Guarded Render API source repair

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact validated main commit to repair
        required: true
        type: string
      confirmation:
        description: Type REPAIR-ONLY to correct service settings without deploying
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: render-api-source-repair
  cancel-in-progress: false

jobs:
  repair-only:
    name: Validate commit, relink official source, clear override without deploying
    if: ${{ inputs.confirmation == 'REPAIR-ONLY' }}
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation and main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "REPAIR-ONLY" ]] || { echo "::error::Confirmation string did not match"; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid commit SHA"; exit 1; }
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "$TARGET_SHA" == "$MAIN_SHA" ]] || { echo "::error::Requested SHA is not current main"; exit 1; }

      - name: Require completed CI and security checks for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" > checks-pages.json
          jq -s '[.[].check_runs[]]' checks-pages.json > checks.json
          required=(
            "Validate (typecheck, lint, test, build)"
            "MCP server and workflow worker"
            "Issue 435 migrations and attachment security"
            "Test agent API contracts"
            "Dependency audit"
            "Trivy filesystem scan"
            "Analyze (javascript-typescript)"
            "Analyze (python)"
            "TruffleHog secret audit"
            "Codacy Security Scan"
          )
          for name in "${required[@]}"; do
            count="$(jq --arg n "$name" '[.[] | select(.name == $n)] | length' checks.json)"
            [[ "$count" -gt 0 ]] || { echo "::error::Required check missing: $name"; exit 1; }
            bad="$(jq --arg n "$name" '[.[] | select(.name == $n) | select(.status != "completed" or .conclusion != "success")] | length' checks.json)"
            [[ "$bad" -eq 0 ]] || { echo "::error::Required check not successful: $name"; exit 1; }
          done

      - name: Confirm Render credential is available
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$RENDER_API_KEY" ]] || { echo "::error::RENDER_API_KEY secret is missing; no Render change was made"; exit 1; }

      - name: Repair official API service build and health configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.render.com/v1/services/srv-dbk4giu7bikc7394a4r0" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --data '{"repo":"https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat","branch":"main","autoDeployTrigger":"off","serviceDetails":{"dockerContext":".","dockerfilePath":"./Dockerfile.api","dockerCommand":"","healthCheckPath":"/health"}}' \
            --output render-service-update.json
          jq -e '.repo == "https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat" and .branch == "main" and .autoDeployTrigger == "off" and .serviceDetails.dockerContext == "." and .serviceDetails.dockerfilePath == "./Dockerfile.api" and .serviceDetails.dockerCommand == "" and .serviceDetails.healthCheckPath == "/health"' render-service-update.json

      - name: Confirm repaired service settings without deploying
        run: |
          set -euo pipefail
          echo "Repository, branch, Dockerfile, Docker context, Docker command override, auto-deploy trigger, and health path were verified."
          echo "No deployment was triggered. The API deployment gate remains closed."
