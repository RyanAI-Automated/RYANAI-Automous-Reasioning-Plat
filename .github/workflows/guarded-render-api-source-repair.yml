name: Guarded Render API source repair

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact validated main commit to deploy
        required: true
        type: string
      confirmation:
        description: Type REPAIR-AND-DEPLOY to proceed
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: render-api-source-repair
  cancel-in-progress: false

jobs:
  repair-and-deploy:
    name: Validate commit, relink official source, deploy API
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation and main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "REPAIR-AND-DEPLOY" ]] || { echo "::error::Confirmation string did not match"; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid commit SHA"; exit 1; }
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "$TARGET_SHA" == "$MAIN_SHA" ]] || { echo "::error::Requested SHA is not current main"; exit 1; }

      - name: Require completed CI and security checks for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" > checks-pages.json
          jq -s '[.[].check_runs[]]' checks-pages.json > checks.json
          required=(
            "Validate (typecheck, lint, test, build)"
            "MCP server and workflow worker"
            "Issue 435 migrations and attachment security"
            "Test agent API contracts"
            "Dependency audit"
            "Trivy filesystem scan"
            "Analyze (javascript-typescript)"
            "Analyze (python)"
            "TruffleHog secret audit"
            "Codacy Security Scan"
          )
          for name in "${required[@]}"; do
            count="$(jq --arg n "$name" '[.[] | select(.name == $n)] | length' checks.json)"
            [[ "$count" -gt 0 ]] || { echo "::error::Required check missing: $name"; exit 1; }
            bad="$(jq --arg n "$name" '[.[] | select(.name == $n) | select(.status != "completed" or .conclusion != "success")] | length' checks.json)"
            [[ "$bad" -eq 0 ]] || { echo "::error::Required check not successful: $name"; exit 1; }
          done

      - name: Confirm Render credential is available
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$RENDER_API_KEY" ]] || { echo "::error::RENDER_API_KEY secret is missing; no Render change was made"; exit 1; }

      - name: Repair official API service build and health configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.render.com/v1/services/srv-dafvs4ht0dsc7380mapg" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --data '{"repo":"https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat","branch":"main","autoDeployTrigger":"off","serviceDetails":{"dockerContext":".","dockerfilePath":"./Dockerfile.api","healthCheckPath":"/health"}}' \
            --output render-service-update.json
          jq -e '.repo == "https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat" and .branch == "main" and .autoDeployTrigger == "off" and .serviceDetails.dockerfilePath == "./Dockerfile.api" and .serviceDetails.healthCheckPath == "/health"' render-service-update.json

      - name: Deploy the exact validated API commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/srv-dafvs4ht0dsc7380mapg/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --data "$(jq -n --arg sha "$TARGET_SHA" '{clearCache:false,commitId:$sha}')" \
            --output render-deploy.json
          DEPLOY_ID="$(jq -er '.id' render-deploy.json)"
          echo "RENDER_DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"
          jq '{id,status,commit}' render-deploy.json

      - name: Wait for deployment to become live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error \
              --url "https://api.render.com/v1/services/srv-dafvs4ht0dsc7380mapg/deploys/$RENDER_DEPLOY_ID" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "accept: application/json" \
              --output render-deploy-final.json
            STATUS="$(jq -r '.status // empty' render-deploy-final.json)"
            DEPLOY_SHA="$(jq -r '.commit.id // .commitId // empty' render-deploy-final.json)"
            echo "Render deployment status: $STATUS"
            [[ -z "$DEPLOY_SHA" || "$DEPLOY_SHA" == "$TARGET_SHA" ]] || { echo "::error::Render deployed an unexpected commit: $DEPLOY_SHA"; exit 1; }
            [[ "$STATUS" != "build_failed" && "$STATUS" != "update_failed" && "$STATUS" != "canceled" ]] || { echo "::error::Render deployment failed"; jq . render-deploy-final.json; exit 1; }
            [[ "$STATUS" == "live" ]] && break
            sleep 15
          done
          [[ "$(jq -r '.status' render-deploy-final.json)" == "live" ]] || { echo "::error::Timed out waiting for Render deployment"; exit 1; }
          [[ "$(jq -r '.commit.id // .commitId // empty' render-deploy-final.json)" == "$TARGET_SHA" ]] || { echo "::error::Live Render deployment does not identify the requested commit"; exit 1; }

      - name: Verify API health endpoint
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 \
              --output health-response.json \
              --write-out '%{http_code}' \
              "https://ryanai-automous-reasoning-plat.onrender.com/health" > health-status.txt; then
              if [[ "$(cat health-status.txt)" == "200" ]]; then
                echo "API /health returned HTTP 200"
                cat health-response.json
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::API /health did not return HTTP 200 after deployment"
          [[ -f health-response.json ]] && cat health-response.json || true
          exit 1

      - name: Verify source connection after update
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --url "https://api.render.com/v1/services/srv-dafvs4ht0dsc7380mapg" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "accept: application/json" \
            --output render-service-final.json
          jq -e '.repo == "https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat" and .branch == "main" and .serviceDetails.dockerfilePath == "./Dockerfile.api" and .serviceDetails.healthCheckPath == "/health"' render-service-final.json
