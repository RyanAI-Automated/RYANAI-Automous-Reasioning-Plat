# Optional Datadog Synthetic tests. Enable only after repository secrets are configured.
name: Run Datadog Synthetic tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetics:
    if: ${{ vars.DATADOG_SYNTHETICS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Datadog credentials
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DD_API_KEY" || -z "$DD_APP_KEY" ]]; then
            echo "::error::DATADOG_SYNTHETICS_ENABLED is true, but DD_API_KEY and/or DD_APP_KEY are missing."
            exit 1
          fi

      - name: Run Datadog Synthetic tests
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: "tag:e2e-tests"
