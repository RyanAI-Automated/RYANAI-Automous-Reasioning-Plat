# Run Datadog Synthetic tests when the repository's Datadog credentials are configured.
# Configure DD_API_KEY and DD_APP_KEY as GitHub Actions secrets to enable the tests.

name: Run Datadog Synthetic tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  synthetics:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip Datadog tests when credentials are not configured
        if: ${{ env.DD_API_KEY == '' || env.DD_APP_KEY == '' }}
        run: echo "::notice::Skipping Datadog Synthetic tests because DD_API_KEY and/or DD_APP_KEY are not configured."

      - name: Run Datadog Synthetic tests
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ env.DD_API_KEY }}
          app_key: ${{ env.DD_APP_KEY }}
          test_search_query: "tag:e2e-tests"
