name: Deploy Vercel Production

on:
  workflow_run:
    workflows: ["CI - Build, Test, and Integrate"]
    branches: [main, master]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy validated commit
    if: >-
      ${{
        vars.VERCEL_DEPLOY_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')
      }}
    uses: ./.github/workflows/deploy.yml
    with:
      commit_sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
