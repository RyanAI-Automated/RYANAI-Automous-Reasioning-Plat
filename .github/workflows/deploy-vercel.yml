name: Deploy Vercel Production

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: Explicitly authorize a production Vercel deployment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy validated commit
    if: inputs.confirm_production_deploy == true && vars.VERCEL_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      commit_sha: ${{ github.sha }}
    secrets: inherit
