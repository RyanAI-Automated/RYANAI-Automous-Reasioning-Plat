name: Issue 435 isolated Supabase migrations and attachment tests

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'supabase/**'
      - 'src/lib/leastPrivilegeGrantsMigration.test.ts'
      - 'src/lib/attachmentStoragePolicy.test.ts'
      - 'src/lib/attachmentQuotaMigration.test.ts'
      - 'src/lib/attachmentUpdateGuardMigration.test.ts'
      - 'src/lib/attachments.test.ts'
      - 'src/server/attachments/scanner.test.ts'
      - '.github/workflows/issue-435-supabase.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main, master]
    paths:
      - 'supabase/**'
      - 'src/lib/leastPrivilegeGrantsMigration.test.ts'
      - 'src/lib/attachmentStoragePolicy.test.ts'
      - 'src/lib/attachmentQuotaMigration.test.ts'
      - 'src/lib/attachmentUpdateGuardMigration.test.ts'
      - 'src/lib/attachments.test.ts'
      - 'src/server/attachments/scanner.test.ts'
      - '.github/workflows/issue-435-supabase.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-435-supabase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attachment-unit-tests:
    name: Focused attachment and grants Vitest suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Run focused security tests
        run: |
          npx vitest run \
            src/lib/leastPrivilegeGrantsMigration.test.ts \
            src/lib/attachmentStoragePolicy.test.ts \
            src/lib/attachmentQuotaMigration.test.ts \
            src/lib/attachmentUpdateGuardMigration.test.ts \
            src/lib/attachments.test.ts \
            src/server/attachments/scanner.test.ts

  local-supabase-migrations:
    name: Fresh install and far-future migration history simulation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase stack
        run: supabase start -x studio,mailpit,edge-runtime,logflare,vector
      - name: Apply all migrations to a fresh local database
        run: |
          set -euo pipefail
          supabase db reset --local
          supabase migration list --local | tee /tmp/fresh-migration-list.txt
          for version in \
            20261030120000 \
            20261030130000 \
            20261030140000 \
            20261031100000 \
            20261031110000 \
            20261031120000 \
            20261031130000 \
            20261031150000 \
            99999999999999; do
            grep -F "$version" /tmp/fresh-migration-list.txt
          done
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM storage.buckets
              WHERE id = 'ryanai-attachments' AND public = false
            ) THEN
              RAISE EXCEPTION 'RyanAI attachment bucket is missing or public';
            END IF;
            IF has_table_privilege('anon', 'public.profiles', 'SELECT') THEN
              RAISE EXCEPTION 'anon unexpectedly has SELECT on profiles';
            END IF;
            IF NOT has_table_privilege('authenticated', 'public.profiles', 'SELECT') THEN
              RAISE EXCEPTION 'authenticated is missing SELECT on profiles';
            END IF;
            IF NOT has_table_privilege('authenticated', 'public.ryanai_attachment_scans', 'SELECT') THEN
              RAISE EXCEPTION 'authenticated is missing read-only scan visibility';
            END IF;
            IF has_table_privilege('authenticated', 'public.ryanai_attachment_scans', 'INSERT') THEN
              RAISE EXCEPTION 'authenticated unexpectedly has INSERT on scan state';
            END IF;
          END $$;
          SQL
      - name: Simulate legacy far-future migration already recorded
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          # This is a disposable CI database. Revoke the corrected grants and
          # remove only the corrective migration's ledger row to model an
          # older installation where 99999999999999 is recorded but the
          # corrective migration is pending. The legacy row remains recorded.
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE r record;
          BEGIN
            FOR r IN
              SELECT schemaname, tablename
              FROM pg_tables
              WHERE schemaname = 'public'
            LOOP
              EXECUTE format(
                'REVOKE ALL PRIVILEGES ON TABLE %I.%I FROM PUBLIC, anon, authenticated',
                r.schemaname, r.tablename
              );
            END LOOP;
          END $$;
          DELETE FROM supabase_migrations.schema_migrations
          WHERE version = '20261031150000';
          SQL
          supabase migration list --local | tee /tmp/pre-include-all-list.txt
          grep -F '99999999999999' /tmp/pre-include-all-list.txt
          if grep -F '20261031150000' /tmp/pre-include-all-list.txt; then
            echo 'Corrective migration unexpectedly remains recorded before simulation.' >&2
            exit 1
          fi
          supabase migration up --local --include-all
          supabase migration list --local | tee /tmp/post-include-all-list.txt
          grep -F '20261031150000' /tmp/post-include-all-list.txt
          grep -F '99999999999999' /tmp/post-include-all-list.txt
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF has_table_privilege('anon', 'public.profiles', 'SELECT') THEN
              RAISE EXCEPTION 'anon regained SELECT after corrective migration';
            END IF;
            IF NOT has_table_privilege('authenticated', 'public.profiles', 'SELECT') THEN
              RAISE EXCEPTION 'authenticated profile SELECT was not restored';
            END IF;
            IF NOT has_table_privilege('authenticated', 'public.ryanai_attachment_scans', 'SELECT') THEN
              RAISE EXCEPTION 'authenticated scan SELECT was not restored';
            END IF;
            IF has_table_privilege('authenticated', 'public.ryanai_attachment_scans', 'INSERT') THEN
              RAISE EXCEPTION 'authenticated gained scan INSERT';
            END IF;
          END $$;
          SQL
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
