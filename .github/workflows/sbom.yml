name: Software Bill of Materials (SBOM)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  generate-sbom:
    name: Generate & Upload SBOMs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: ryan-app-sbom.spdx.json
          artifact-name: ryan-app-sbom

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: ryan-app-sbom.cyclonedx.json
          artifact-name: ryan-app-cyclonedx