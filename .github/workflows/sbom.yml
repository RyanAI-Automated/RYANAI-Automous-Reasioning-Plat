name: Software Bill of Materials (SBOM)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # PR updates supersede older runs for the same PR only. Main uses its own
  # stable ref group and is never cancelled by a pull_request event.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate-sbom:
    name: Generate & Upload SBOMs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: ryan-app-sbom.spdx.json
          artifact-name: ryan-app-sbom

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: ryan-app-sbom.cyclonedx.json
          artifact-name: ryan-app-cyclonedx