name: Vercel Workspace Validation

on:
  workflow_call:
    secrets: {}
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workspace:
    name: Validate Workspace (No Deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify npm lockfile
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "::error::package-lock.json is required for reproducible CI installs."
            exit 1
          fi
          echo "npm lockfile found."

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build web application
        run: npm run build:web

      - name: Report production deployment policy
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          echo "This workflow validates the application and does not deploy."
          echo "Production deployments are centralized in .github/workflows/deploy-vercel.yml."
          echo "That workflow requires a successful CI run and vars.VERCEL_DEPLOY_ENABLED=true."
          echo "Keep only one Vercel deployment source enabled to avoid duplicate builds and quota exhaustion."
