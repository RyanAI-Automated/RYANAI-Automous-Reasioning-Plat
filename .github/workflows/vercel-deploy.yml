name: Monorepo Vercel Deployment & Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate Workspace & Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CI: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify npm lockfile
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "Error: package-lock.json is required for reproducible CI installs."
            exit 1
          fi
          echo "npm lockfile found."

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build web application
        run: npm run build:web

      - name: Deploy to Vercel
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push' }}
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ] && [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            echo "[*] Linking Vercel project..."
            npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

            echo "[*] Pulling Vercel production environment..."
            npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"

            echo "[*] Building project via Vercel CLI..."
            npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"

            echo "[*] Deploying prebuilt artifacts to Vercel production..."
            npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
          else
            echo "[!] Vercel deployment secrets are incomplete; skipping CLI deployment. Git-based Vercel deployments may still run."
          fi