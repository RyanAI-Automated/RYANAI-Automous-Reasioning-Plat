name: Project Ryan Triage & Auto-Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  triage:
    name: Triage & Auto-Label
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Automated Path-Based Labeler
        if: github.event_name == 'pull_request_target'
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: '.github/labeler.yml'
          sync-labels: true

      - name: Triage Completion Notice
        run: echo "✅ Issue and Pull Request triage completed successfully for event '${{ github.event_name }}'."