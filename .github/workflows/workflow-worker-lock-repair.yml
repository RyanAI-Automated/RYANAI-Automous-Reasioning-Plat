name: Workflow worker lockfile repair

on:
  push:
    branches:
      - fix/workflow-worker-dependency-lock

permissions:
  contents: write

concurrency:
  group: workflow-worker-lock-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validate worker manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('workflows-ryanai/package.json','utf8')); console.log('worker manifest parses')"
      - name: Regenerate worker lockfile
        run: npm install --prefix workflows-ryanai --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean worker install
        run: npm ci --prefix workflows-ryanai --no-audit --no-fund
      - name: Build workflow worker
        run: npm --prefix workflows-ryanai run build
      - name: Commit validated worker manifest and lockfile
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflows-ryanai/package.json workflows-ryanai/package-lock.json
          if git diff --cached --quiet; then
            echo "Worker dependency files are already current."
          else
            git commit -m "fix: repair workflow worker dependency lock"
            git push origin HEAD
          fi
      - name: Upload worker lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflows-ryanai-package-lock
          path: workflows-ryanai/package-lock.json
          if-no-files-found: warn
          retention-days: 7
