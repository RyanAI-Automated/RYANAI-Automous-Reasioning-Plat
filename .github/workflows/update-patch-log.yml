name: Update patch log after merged PR

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: patch-update-main
  cancel-in-progress: false

jobs:
  record-merged-pr:
    if: github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'patch-log/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record confirmed merge
        run: node scripts/update-patch-log.mjs
      - name: Open a patch-log update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="$(node -p "JSON.parse(require('fs').readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).pull_request.number")"
          branch="patch-log/pr-$PR_NUMBER"
          git switch --create "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch_update.md
          if git diff --cached --quiet; then
            echo "PR #$PR_NUMBER is already recorded."
            exit 0
          fi
          git commit -m "docs: record merged PR #$PR_NUMBER"
          git push --force origin "$branch"
          existing_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$branch" --jq '.[0].number // empty')"
          if [ -z "$existing_pr" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls" --method POST \
              -f title="docs: record merged PR #$PR_NUMBER" \
              -f head="$GITHUB_REPOSITORY_OWNER:$branch" \
              -f base="main" \
              -f body="Automated, idempotent patch log entry for confirmed merged PR #$PR_NUMBER. This PR does not deploy applications."
          else
            echo "Patch-log update PR #$existing_pr already exists."
          fi
