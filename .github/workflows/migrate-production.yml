name: Production database migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Select APPLY only after reviewing the migrations for the current main commit.
        type: choice
        required: true
        default: "NO"
        options:
          - "NO"
          - "APPLY"

permissions:
  contents: read
  checks: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify exact main commit and required checks
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target_sha: ${{ steps.verify.outputs.target_sha }}
    env:
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Require explicit migration authorization and current main
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "APPLY" ]] || {
            echo "::error::Select APPLY to authorize this production migration run."
            exit 1
          }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid migration commit SHA."
            exit 1
          }
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "$TARGET_SHA" == "$MAIN_SHA" ]] || {
            echo "::error::The requested workflow run is not for the current main commit."
            exit 1
          }
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Require successful CI and security checks for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=(
            "Validate (typecheck, lint, test, build)"
            "MCP server and workflow worker"
            "Issue 435 migrations and attachment security"
            "Test agent API contracts"
            "Dependency audit"
            "Trivy filesystem scan"
            "Analyze (javascript-typescript)"
            "Analyze (python)"
            "TruffleHog secret audit"
            "Codacy Security Scan"
          )
          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" > checks-pages.json
          jq -s '[.[].check_runs[]] | group_by(.name) | map(sort_by(.started_at // .completed_at // "") | last)' checks-pages.json > checks.json
          for name in "${required[@]}"; do
            jq -e --arg n "$name" '
              [.[] | select(.name == $n)]
              | length == 1 and
                .[0].status == "completed" and
                .[0].conclusion == "success"
            ' checks.json > /dev/null || {
              echo "::error::Required exact-commit check is missing or not successful: $name"
              exit 1
            }
          done
          echo "All required CI and security checks passed for $TARGET_SHA."

      - name: Require isolated provider verification for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --workflow provider-verification.yml --commit "$TARGET_SHA" \
            --json databaseId,status,conclusion,event,headSha,createdAt --limit 50 > provider-runs.json
          jq -e --arg sha "$TARGET_SHA" '
            [ .[] | select(.headSha == $sha and .event == "push") ]
            | sort_by(.createdAt)
            | last
            | select(.status == "completed" and .conclusion == "success")
          ' provider-runs.json > /dev/null || {
            echo "::error::The latest isolated provider verification for this exact commit has not succeeded."
            exit 1
          }

  migrate:
    name: Apply reviewed Prisma migrations to Supabase production
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-migrations
    env:
      TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
      SUPABASE_URL: https://narsvpwymvlrhurqbthu.supabase.co
      SUPABASE_SSL_ROOT_CERT_PATH: /usr/local/share/ca-certificates/supabase-prod-ca-2021.crt

    steps:
      - name: Checkout exact migration commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          persist-credentials: false

      - name: Validate protected database configuration without exposing credentials
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          SUPABASE_SESSION_POOLER_HOST: ${{ vars.SUPABASE_SESSION_POOLER_HOST }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const raw = process.env.PRODUCTION_DATABASE_URL;
          const configuredPooler = process.env.SUPABASE_SESSION_POOLER_HOST;
          if (!raw) throw new Error('PRODUCTION_DATABASE_URL is missing from the protected environment.');
          if (!/^[a-z0-9-]+\.pooler\.supabase\.com$/.test(configuredPooler ?? '')) {
            throw new Error('SUPABASE_SESSION_POOLER_HOST must be the exact hostname copied from Supabase Connect.');
          }
          let url;
          try {
            url = new URL(raw);
          } catch {
            throw new Error('PRODUCTION_DATABASE_URL is not a valid PostgreSQL URL.');
          }
          if (!['postgres:', 'postgresql:'].includes(url.protocol) || !url.password) {
            throw new Error('PRODUCTION_DATABASE_URL must be a credentialed PostgreSQL URL.');
          }
          const ref = 'narsvpwymvlrhurqbthu';
          if (url.hostname !== `db.${ref}.supabase.co` && !url.hostname.endsWith('.pooler.supabase.com')) {
            throw new Error('PRODUCTION_DATABASE_URL is not a connection to the configured Supabase project.');
          }
          console.log('Protected Supabase database endpoint configuration verified; credentials redacted.');
          NODE

      - name: Build the dedicated migration image
        run: docker build --pull --target migrate -t "ryanai-migrate:$TARGET_SHA" .

      - name: Apply committed migrations using strict Supabase TLS
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          SUPABASE_SESSION_POOLER_HOST: ${{ vars.SUPABASE_SESSION_POOLER_HOST }}
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --env NODE_ENV=production \
            --env DATABASE_URL \
            --env SUPABASE_URL \
            --env SUPABASE_SESSION_POOLER_HOST \
            --env SUPABASE_SSL_ROOT_CERT_PATH \
            "ryanai-migrate:$TARGET_SHA"
          echo "Prisma migrations completed successfully for $TARGET_SHA." >> "$GITHUB_STEP_SUMMARY"
