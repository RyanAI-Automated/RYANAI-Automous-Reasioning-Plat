name: Root lockfile regeneration validation

on:
  push:
    branches:
      - repair/root-lockfile-regeneration-runner

permissions:
  contents: read

concurrency:
  group: root-lockfile-regeneration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-and-validate:
    name: Regenerate root lockfile and validate install
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Record toolchain
        run: |
          node --version
          npm --version
          npm config get registry

      - name: Validate package manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')); console.log('package.json parses')"

      - name: Regenerate lockfile from the committed manifest
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Validate regenerated lockfile and root dependency alignment
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.lockfileVersion !== 3) throw new Error(`Expected lockfileVersion 3, got ${lock.lockfileVersion}`);
          const root = lock.packages?.[''];
          if (!root) throw new Error('Lockfile is missing packages[""]');
          for (const section of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            const expected = pkg[section] ?? {};
            const actual = root[section] ?? {};
            for (const [name, spec] of Object.entries(expected)) {
              if (actual[name] !== spec) throw new Error(`${section} mismatch for ${name}: manifest=${spec}, lock=${actual[name]}`);
            }
          }
          console.log('Lockfile JSON valid; root dependency specs match package.json');
          NODE

      - name: Verify clean CI-equivalent dependency installation
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify installed dependency tree
        run: npm ls --depth=0

      - name: Run root validation suite
        run: npm run validate

      - name: Upload regenerated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-root-package-lock
          path: package-lock.json
          if-no-files-found: warn
          retention-days: 7
