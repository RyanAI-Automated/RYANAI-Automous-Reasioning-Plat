name: Security - Scan and Audit

# CodeQL lives in codeql.yml, secret scanning in secret-scan.yml and
# container image scanning in container-security.yml.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}

jobs:
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install verified Trivy release
        env:
          TRIVY_VERSION: 0.70.0
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          release_url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          # Download the official release assets directly from GitHub. This
          # avoids the get.trivy.dev redirect host used by setup-trivy.
          curl --fail --show-error --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            "$release_url/$archive" -o "$workdir/$archive"
          curl --fail --show-error --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            "$release_url/trivy_${TRIVY_VERSION}_checksums.txt" \
            -o "$workdir/checksums.txt"

          expected="$(awk -v file="$archive" '$2 == file || $2 == "*"file { print $1; exit }' "$workdir/checksums.txt")"
          test -n "$expected" || { echo "Official checksum missing for $archive" >&2; exit 1; }
          printf '%s  %s\n' "$expected" "$workdir/$archive" | sha256sum --check --strict -

          tar -xzf "$workdir/$archive" -C "$workdir" trivy
          sudo install -m 0755 "$workdir/trivy" /usr/local/bin/trivy
          trivy --version

      - name: Generate complete Trivy SARIF report
        run: |
          set -euo pipefail
          trivy fs \
            --scanners vuln \
            --format sarif \
            --output trivy-results.sarif \
            --exit-code 0 \
            --skip-dirs node_modules,**/node_modules,.cache,src-tauri/target \
            .

      - name: Fail only on HIGH or CRITICAL vulnerabilities
        run: |
          set -euo pipefail
          trivy fs \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --skip-dirs node_modules,**/node_modules,.cache,src-tauri/target \
            .

      - name: Upload Trivy results to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Preserve Trivy filesystem SARIF for remediation
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-sarif
          path: trivy-results.sarif
          retention-days: 7

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency tree (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Check Snyk token availability
        id: snyk-token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [[ -n "$SNYK_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "SNYK_TOKEN is not configured; skipping the optional Snyk scan."
          fi

      - name: Snyk scan
        if: steps.snyk-token.outputs.configured == 'true'
        uses: snyk/actions/node@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
