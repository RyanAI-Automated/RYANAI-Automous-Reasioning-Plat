name: Container Security Scan

on:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.api'
      - 'index.html'
      - 'mcp-server/**'
      - 'docker-compose.yml'
      - 'nginx.conf.template'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'app/**'
      - 'store/**'
      - 'stacks/**'
      - 'prisma/**'
      - 'scripts/copy-server-assets.mjs'
      - '.github/workflows/container-security.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.api'
      - 'index.html'
      - 'mcp-server/**'
      - 'docker-compose.yml'
      - 'nginx.conf.template'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'app/**'
      - 'store/**'
      - 'stacks/**'
      - 'prisma/**'
      - 'scripts/copy-server-assets.mjs'
      - '.github/workflows/container-security.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: Dockerfile
            target: api
          - image: web
            file: Dockerfile
            target: web
          - image: mcp
            file: mcp-server/Dockerfile
            target: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          tags: ryanai-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Scan for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ryanai-${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Print vulnerability details for failed scans
        if: failure()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ryanai-${{ matrix.image }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload scan results
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image)) != '' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: container-${{ matrix.image }}
