name: Container Security Scan

on:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.api'
      - 'index.html'
      - 'mcp-server/**'
      - 'docker-compose.yml'
      - 'nginx.conf.template'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'app/**'
      - 'store/**'
      - 'stacks/**'
      - 'prisma/**'
      - 'scripts/copy-server-assets.mjs'
      - '.github/workflows/container-security.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.api'
      - 'index.html'
      - 'mcp-server/**'
      - 'docker-compose.yml'
      - 'nginx.conf.template'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'app/**'
      - 'store/**'
      - 'stacks/**'
      - 'prisma/**'
      - 'scripts/copy-server-assets.mjs'
      - '.github/workflows/container-security.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: Dockerfile
            target: api
          - image: web
            file: Dockerfile
            target: web
          - image: mcp
            file: mcp-server/Dockerfile
            target: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          tags: ryanai-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Scan for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ryanai-${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          # Keep SARIF at the same severity threshold as the blocking gate.
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'

      - name: Summarize Trivy SARIF findings on pull requests
        if: always() && github.event_name == 'pull_request' && hashFiles(format('trivy-{0}.sarif', matrix.image)) != ''
        env:
          SARIF_PATH: trivy-${{ matrix.image }}.sarif
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.SARIF_PATH, 'utf8'));
          const findings = (report.runs || []).flatMap((run) =>
            (run.results || []).map((result) => ({
              ruleId: result.ruleId || result.rule?.id || 'unknown',
              level: result.level || 'unknown',
              locations: (result.locations || []).map((location) => ({
                path: location.physicalLocation?.artifactLocation?.uri || 'unknown',
                line: location.physicalLocation?.region?.startLine ?? null,
              })),
            })),
          );
          const counts = {};
          for (const finding of findings) {
            counts[finding.level] = (counts[finding.level] || 0) + 1;
          }
          console.log(`Trivy SARIF results: ${findings.length}; levels: ${JSON.stringify(counts)}`);
          // Never print secret contents or SARIF messages; only rule IDs and source locations.
          console.log(JSON.stringify(findings, null, 2));
          NODE

      - name: Preserve Trivy SARIF on pull requests
        if: always() && github.event_name == 'pull_request' && hashFiles(format('trivy-{0}.sarif', matrix.image)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}-sarif
          path: trivy-${{ matrix.image }}.sarif
          retention-days: 7

      - name: Print vulnerability details for failed scans
        if: failure()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ryanai-${{ matrix.image }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload scan results
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image)) != '' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: container-${{ matrix.image }}
