name: Project Ryan Stale Issue & PR Cleaner

on:
  schedule:
    - cron: '30 0 * * *' # Run daily at 00:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stale:
    name: Close Stale Issues & PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Close Stale Issues and Pull Requests
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-close: 7
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity. It will be closed in 7 days if no further activity occurs.'
          stale-pr-message: 'This pull request has been automatically marked as stale because it has not had recent activity. It will be closed in 7 days if no further activity occurs.'
          close-issue-message: 'This issue was closed because it remained inactive for 7 days after being marked as stale.'
          close-pr-message: 'This pull request was closed because it remained inactive for 7 days after being marked as stale.'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,epic,dependencies,blocked'
          exempt-pr-labels: 'pinned,security,epic,dependencies,blocked'
          operations-per-run: 50