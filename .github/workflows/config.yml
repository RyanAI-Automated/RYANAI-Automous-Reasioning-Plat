name: Configuration Validation

on:
  push:
    branches: [main, master]
    paths:
      - '*.json'
      - 'tsconfig*.json'
      - '.bolt/**'
      - '.devcontainer/**'
      - '.github/**'
      - 'scripts/validate-github-workflows.mjs'
  pull_request:
    branches: [main, master]
    paths:
      - '*.json'
      - 'tsconfig*.json'
      - '.bolt/**'
      - '.devcontainer/**'
      - '.github/**'
      - 'scripts/validate-github-workflows.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-configs:
    name: Validate configuration files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate JSON configuration
        run: |
          node --input-type=module -e '
            import { existsSync, readFileSync } from "node:fs";
            const files = [
              "package.json", "package-lock.json", "vercel.json",
              ".bolt/config.json", ".devcontainer/devcontainer.json",
              "tsconfig.json", "tsconfig.base.json", "tsconfig.app.json",
              "tsconfig.server.json", "tsconfig.node.json", "tsconfig.mcp.json",
            ];
            let failed = false;
            for (const file of files) {
              if (!existsSync(file)) { console.log(`SKIP ${file} (not present)`); continue; }
              try { JSON.parse(readFileSync(file, "utf8")); console.log(`PASS ${file}`); }
              catch (error) { console.error(`FAIL ${file}: ${error.message}`); failed = true; }
            }
            process.exit(failed ? 1 : 0);
          '

      - name: Validate GitHub workflow files
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          npm run workflow:validate
