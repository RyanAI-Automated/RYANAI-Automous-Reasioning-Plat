name: Agent API Regression Tests

on:
  push: {}
  pull_request: {}
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Test agent API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ryanai
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ryanai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ryanai -d ryanai_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ryanai:ci_password@127.0.0.1:5432/ryanai_db
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci_only_secret_at_least_32_characters_long
      OPENAI_API_KEY: ""
      API_BASE_URL: http://127.0.0.1:3000
      WEB_BASE_URL: http://127.0.0.1:9090
      MCP_URL: http://127.0.0.1:8765

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Install locked MCP dependencies
        run: npm --prefix mcp-server ci

      - name: Prepare disposable PostgreSQL with Supabase Auth compatibility
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY,
            email text,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now()
          );
          SQL

      - name: Set up Database Schema
        run: npm run db:setup

      - name: Build frontend and API in safe output order
        run: |
          npm run build:client
          npm run build:server
          test -s dist/server/server/launcher.js

      - name: Start services and verify readiness and preview proxy
        shell: bash
        run: |
          set -euo pipefail
          npm run start > api.log 2>&1 &
          api_pid=$!
          # Vite reads this value when preview starts; without it the preview
          # silently falls back to the local-development API port.
          VITE_API_BASE_URL=http://127.0.0.1:3000 npm run preview -- --host 127.0.0.1 --port 9090 > web.log 2>&1 &
          web_pid=$!
          MCP_HOST=127.0.0.1 MCP_PORT=8765 npm --prefix mcp-server run start:http > mcp.log 2>&1 &
          mcp_pid=$!

          cleanup() {
            echo "Shutting down background services..."
            kill "$api_pid" "$web_pid" "$mcp_pid" 2>/dev/null || true
            wait "$api_pid" "$web_pid" "$mcp_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          node scripts/wait-for-regression-services.mjs

      - name: Run unit and agent API regression tests
        run: |
          npm test
          npm run test:integration
          npm run test:e2e

      - name: Print service logs on failure
        if: failure()
        shell: bash
        run: |
          for name in api web mcp; do
            echo "::group::${name} service log"
            if [ -f "${name}.log" ]; then cat "${name}.log"; else echo "${name}.log was not created"; fi
            echo "::endgroup::"
          done

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-api-regression-service-logs
          path: |
            api.log
            web.log
            mcp.log
          if-no-files-found: warn
          retention-days: 7
