name: Copilot Setup & Verification Steps

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20.x'
      target-path:
        required: false
        type: string
        default: 'features/copilot'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'features/copilot/**'
      - '.github/workflows/copilot-setup-steps.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-and-verify:
    name: Setup & Verify Copilot Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version || '20.x' }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type-Check & Lint
        run: |
          npx tsc --noEmit --pretty
          npm run lint

      - name: Run Scoped Copilot Feature Tests
        run: |
          npm test -- "${{ inputs.target-path || 'features/copilot' }}" --passWithNoTests
        env:
          CI: true
          NODE_ENV: test