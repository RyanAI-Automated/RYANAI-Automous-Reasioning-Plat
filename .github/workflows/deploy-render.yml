name: Deploy API to Render staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Select STAGE only to deploy this open PR head to an isolated Render staging service.
        type: choice
        required: true
        default: "NO"
        options:
          - "NO"
          - "STAGE"

permissions:
  contents: read
  checks: read

concurrency:
  group: render-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy reviewed PR head to isolated Render staging
    if: >-
      ${{
        inputs.confirmation == 'STAGE' &&
        vars.RENDER_STAGING_DEPLOY_ENABLED == 'true' &&
        vars.RENDER_STAGING_ISOLATION_CONFIRMED == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      TARGET_SHA: ${{ github.sha }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_STAGING_SERVICE_ID }}
      RENDER_API_URL: ${{ vars.RENDER_STAGING_API_URL }}

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require an open PR whose head is this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/pulls" > linked-prs.json
          jq -e --arg sha "$TARGET_SHA" '[.[] | select(.state == "open" and .head.sha == $sha)] | length > 0' linked-prs.json >/dev/null || {
            echo "::error::Staging is limited to an open PR head at the exact requested SHA."
            exit 1
          }

      - name: Require exact-head CI and security checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=(
            "Validate (typecheck, lint, test, build)"
            "MCP server and workflow worker"
            "Issue 435 migrations and attachment security"
            "Test agent API contracts"
            "Dependency audit"
            "Trivy filesystem scan"
            "Analyze (javascript-typescript)"
            "Analyze (python)"
            "TruffleHog secret audit"
            "Codacy Security Scan"
          )
          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" > check-pages.json
          jq -s '[.[].check_runs[]]' check-pages.json > checks.json
          for name in "${required[@]}"; do
            jq -e --arg name "$name" '
              [.[] | select(.name == $name)] as $matches
              | ($matches | length) > 0
                and all($matches[]; .status == "completed" and .conclusion == "success")
            ' checks.json >/dev/null || {
              echo "::error::Required check is missing, queued, skipped, cancelled, or failed: $name"
              exit 1
            }
          done

      - name: Verify isolated Render staging service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$RENDER_API_KEY" ]] || { echo "::error::Missing Render API credential"; exit 1; }
          [[ -n "$RENDER_SERVICE_ID" && "$RENDER_SERVICE_ID" != "srv-dbk4giu7bikc7394a4r0" ]] || { echo "::error::A separate Render staging service ID is required"; exit 1; }
          [[ "$RENDER_API_URL" == https://* ]] || { echo "::error::A verified HTTPS staging API URL is required"; exit 1; }
          curl --fail-with-body --silent --show-error \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "accept: application/json" > render-staging-service.json
          jq -e '
            (.name | startswith("ryanai-staging"))
            and (.repo == "https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat")
            and (.autoDeployTrigger == "off")
          ' render-staging-service.json >/dev/null || {
            echo "::error::Render target is not a separately named, official-repository staging service with auto-deploy disabled."
            exit 1
          }

      - name: Deploy exact PR commit to Render staging
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --data "$(jq -n --arg sha "$TARGET_SHA" '{commitId:$sha}')" > render-staging-deploy.json
          DEPLOY_ID="$(jq -er '.id' render-staging-deploy.json)"
          echo "RENDER_DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"

      - name: Wait for exact staging deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            curl --fail-with-body --silent --show-error \
              --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$RENDER_DEPLOY_ID" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "accept: application/json" > render-staging-final.json
            STATUS="$(jq -r '.status // empty' render-staging-final.json)"
            SHA="$(jq -r '.commit.id // .commitId // empty' render-staging-final.json)"
            [[ -z "$SHA" || "$SHA" == "$TARGET_SHA" ]] || { echo "::error::Render deployed an unexpected commit"; exit 1; }
            [[ "$STATUS" != "build_failed" && "$STATUS" != "update_failed" && "$STATUS" != "canceled" ]] || { echo "::error::Render staging deployment failed"; exit 1; }
            [[ "$STATUS" == "live" ]] && break
            sleep 15
          done
          [[ "$(jq -r '.status' render-staging-final.json)" == "live" ]] || { echo "::error::Render staging did not become live"; exit 1; }
          [[ "$(jq -r '.commit.id // .commitId // empty' render-staging-final.json)" == "$TARGET_SHA" ]] || { echo "::error::Staging deployment SHA mismatch"; exit 1; }

      - name: Verify staging API health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "$RENDER_API_URL/health"
