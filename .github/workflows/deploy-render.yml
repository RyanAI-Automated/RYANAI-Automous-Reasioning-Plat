name: Deploy API to Render

# Trigger only after the actual container publishing workflow succeeds.
# Render remains opt-in and requires an explicit gate plus a configured deploy hook.
on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: Explicitly authorize a production Render deployment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render deploy
    if: inputs.confirm_production_deploy == true && vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Validate Render deployment configuration
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "::error::RENDER_DEPLOY_ENABLED is true but RENDER_DEPLOY_HOOK_URL is missing."
            exit 1
          fi

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy hook accepted the request."
