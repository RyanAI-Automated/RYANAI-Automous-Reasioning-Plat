name: Deploy Render Production

on:
  workflow_run:
    workflows: ["CI - Build, Test, and Integrate"]
    branches: [main, master]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy validated API and web services to Render
    if: >-
      ${{
        vars.RENDER_DEPLOY_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Validate Render deployment configuration
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          RENDER_WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for key in RENDER_API_DEPLOY_HOOK_URL RENDER_WEB_DEPLOY_HOOK_URL; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::RENDER_DEPLOY_ENABLED is true but $key is missing."
              exit 1
            fi
          done

      - name: Trigger Render API deployment
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 -X POST "$RENDER_API_DEPLOY_HOOK_URL" > /dev/null
          echo "Render API deploy hook accepted the request."

      - name: Trigger Render web deployment
        env:
          RENDER_WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 -X POST "$RENDER_WEB_DEPLOY_HOOK_URL" > /dev/null
          echo "Render web deploy hook accepted the request."
