name: Database Schema Validation

on:
  push:
    branches: [main, master]
    paths:
      - 'prisma/**'
      - 'src/db/**'
      - 'tests/fixtures/supabase-auth-ci-*.sql'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/database.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'prisma/**'
      - 'src/db/**'
      - 'tests/fixtures/supabase-auth-ci-*.sql'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ryanai
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ryanai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ryanai -d ryanai_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ryanai:ci_password@localhost:5432/ryanai_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate Prisma schema
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Provision minimal Supabase Auth roles and schema for CI
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_password \
            -v "$GITHUB_WORKSPACE/tests/fixtures/supabase-auth-ci-bootstrap.sql:/tmp/supabase-auth-ci-bootstrap.sql:ro" \
            postgres:16-alpine psql -h 127.0.0.1 -U ryanai -d ryanai_db \
              -v ON_ERROR_STOP=1 -f /tmp/supabase-auth-ci-bootstrap.sql

      - name: Apply committed migrations to ephemeral PostgreSQL
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Verify Supabase Auth identity bridge insert, update, and delete
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_password \
            -v "$GITHUB_WORKSPACE/tests/fixtures/supabase-auth-ci-bridge-smoke.sql:/tmp/supabase-auth-ci-bridge-smoke.sql:ro" \
            postgres:16-alpine psql -h 127.0.0.1 -U ryanai -d ryanai_db \
              -v ON_ERROR_STOP=1 -f /tmp/supabase-auth-ci-bridge-smoke.sql

      - name: Create a second disposable database for the migration image
        env:
          PGPASSWORD: ci_password
        run: |
          docker run --rm --network host -e PGPASSWORD \
            postgres:16-alpine createdb -h 127.0.0.1 -U ryanai ryanai_migration_container
          docker run --rm --network host -e PGPASSWORD \
            -v "$GITHUB_WORKSPACE/tests/fixtures/supabase-auth-ci-bootstrap.sql:/tmp/supabase-auth-ci-bootstrap.sql:ro" \
            postgres:16-alpine psql -h 127.0.0.1 -U ryanai -d ryanai_migration_container \
              -v ON_ERROR_STOP=1 -f /tmp/supabase-auth-ci-bootstrap.sql

      - name: Build and run the one-shot migration image twice
        env:
          MIGRATION_DATABASE_URL: postgresql://ryanai:ci_password@127.0.0.1:5432/ryanai_migration_container
        run: |
          set -euo pipefail
          docker build --target migrate -t ryanai-migrate:ci .
          docker run --rm --network host --env DATABASE_URL="$MIGRATION_DATABASE_URL" ryanai-migrate:ci
          # A second invocation must be a no-op, proving safe restart behavior.
          docker run --rm --network host --env DATABASE_URL="$MIGRATION_DATABASE_URL" ryanai-migrate:ci
          # Prisma models the vector column as Unsupported and cannot represent
          # pgvector's HNSW operator-class index. Verify that SQL-managed index
          # exists, then exclude it from Prisma's ORM-only drift comparison.
          docker run --rm --network host -e PGPASSWORD=ci_password postgres:16-alpine \
            psql -h 127.0.0.1 -U ryanai -d ryanai_migration_container -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname = 'public'
                AND indexname = 'idx_reasoning_embedding'
                AND indexdef ILIKE '%USING hnsw%'
                AND indexdef ILIKE '%vector_cosine_ops%'
            ) THEN
              RAISE EXCEPTION 'Expected SQL-managed pgvector HNSW cosine index is missing';
            END IF;
          END
          $$;
          DROP INDEX public.idx_reasoning_embedding;
          SQL
          npx prisma migrate diff --from-url "$MIGRATION_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Verify migrations match the Prisma data model
        run: |
          set -euo pipefail
          # Verify the extension-specific index independently, then remove it
          # only from this disposable CI database before Prisma schema diff.
          docker run --rm --network host -e PGPASSWORD=ci_password postgres:16-alpine \
            psql -h 127.0.0.1 -U ryanai -d ryanai_db -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname = 'public'
                AND indexname = 'idx_reasoning_embedding'
                AND indexdef ILIKE '%USING hnsw%'
                AND indexdef ILIKE '%vector_cosine_ops%'
            ) THEN
              RAISE EXCEPTION 'Expected SQL-managed pgvector HNSW cosine index is missing';
            END IF;
          END
          $$;
          DROP INDEX public.idx_reasoning_embedding;
          SQL
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
