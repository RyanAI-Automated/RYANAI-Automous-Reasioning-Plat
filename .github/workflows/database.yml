name: Database Schema Validation

on:
  push:
    branches: [main, master]
    paths:
      - 'prisma/**'
      - 'src/db/**'
      - '.github/workflows/database.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'prisma/**'
      - 'src/db/**'
      - '.github/workflows/database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ryanai
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ryanai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ryanai -d ryanai_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ryanai:ci_password@localhost:5432/ryanai_db

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate Prisma schema
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Apply schema to ephemeral PostgreSQL
        run: npx prisma db push --schema=prisma/schema.prisma --skip-generate
