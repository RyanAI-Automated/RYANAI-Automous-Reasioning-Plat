name: Python Core Syntax Checks

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**/*.py"
      - "basic.py"
      - "reactGraph.py"
      - "test_mongo.py"
      - "requirements.txt"
      - ".github/workflows/python-package-conda.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/**/*.py"
      - "basic.py"
      - "reactGraph.py"
      - "test_mongo.py"
      - "requirements.txt"
      - ".github/workflows/python-package-conda.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check core Python scripts
        run: python scripts/check-python-core.py
      - name: Compile optional Python examples
        run: python -m compileall -q basic.py reactGraph.py test_mongo.py scripts
