name: Production and Preview Smoke Tests

# Smoke tests are deliberately manual: scheduled runs previously defaulted to
# production and failed when production endpoint secrets were not configured.
# An operator must explicitly choose the target environment before any request.
on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Environment to verify
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Verify explicitly selected frontend and API endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check configured frontend and API endpoints
        env:
          TARGET_ENV: ${{ inputs.target_env }}
          PROD_API_URL: ${{ secrets.PROD_GATEWAY_URL }}
          PROD_FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
          PREVIEW_API_URL: ${{ secrets.PREVIEW_GATEWAY_URL }}
          PREVIEW_FRONTEND_URL: ${{ secrets.PREVIEW_FRONTEND_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_ENV" == "production" ]]; then
            api_url="$PROD_API_URL"
            frontend_url="$PROD_FRONTEND_URL"
          elif [[ "$TARGET_ENV" == "preview" ]]; then
            api_url="$PREVIEW_API_URL"
            frontend_url="$PREVIEW_FRONTEND_URL"
          else
            echo "::error::Unsupported target environment."
            exit 1
          fi
          [[ -n "$api_url" ]] || { echo "::error::Configure the API URL secret for $TARGET_ENV."; exit 1; }
          [[ -n "$frontend_url" ]] || { echo "::error::Configure the frontend URL secret for $TARGET_ENV."; exit 1; }
          echo "Checking selected frontend endpoint."
          curl --fail --silent --show-error --location --max-time 20 "$frontend_url" --output /dev/null
          echo "Checking selected API health endpoint."
          curl --fail --silent --show-error --location --max-time 20 "$api_url" --output /dev/null
