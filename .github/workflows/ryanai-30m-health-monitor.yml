name: RyanAI 30-minute health monitor

on:
  schedule:
    # GitHub Actions cron is UTC; runs at :00 and :30 each hour.
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read
  statuses: read

concurrency:
  group: ryanai-30-minute-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out monitor logic
        uses: actions/checkout@v4

      - name: Test fail-closed CI summarizer
        run: node --test scripts/ryanai-monitor-ci.test.cjs

      - name: Check PR #936 and public Render health endpoints
        uses: actions/github-script@v7
        env:
          MONITORED_PR_NUMBER: "936"
          API_HEALTH_URL: "https://ryanai-api.onrender.com/health"
          FRONTEND_URL: "https://ryanai-web.onrender.com/"
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = Number(process.env.MONITORED_PR_NUMBER);

            async function probe(url) {
              const started = Date.now();
              try {
                const response = await fetch(url, {
                  method: 'GET',
                  redirect: 'follow',
                  headers: { 'user-agent': 'RyanAI-GitHub-Health-Monitor/1.0' },
                  signal: AbortSignal.timeout(45000),
                });
                return {
                  level: response.ok ? 'up' : 'down',
                  status: response.status,
                  durationMs: Date.now() - started,
                };
              } catch (error) {
                return {
                  level: 'down',
                  status: null,
                  durationMs: Date.now() - started,
                  error: error && typeof error.name === 'string' ? error.name : 'NetworkError',
                };
              }
            }

            const { summarizeCi } = require(process.env.GITHUB_WORKSPACE + '/scripts/ryanai-monitor-ci.cjs');
            const prResponse = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            const pr = prResponse.data;
            const headSha = pr.head.sha;

            const [checkRunsResult, combinedResult, api, frontend] = await Promise.all([
              github.rest.checks.listForRef({ owner, repo, ref: headSha, per_page: 100 }),
              github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: headSha }).catch(() => ({ data: { state: 'unknown', statuses: [] } })),
              probe(process.env.API_HEALTH_URL),
              probe(process.env.FRONTEND_URL),
            ]);

            const ci = summarizeCi(checkRunsResult.data, combinedResult.data);
            const prLevel = pr.merged ? 'merged' : (pr.state === 'closed' ? 'closed' : 'open');
            const levels = {
              pr: prLevel,
              ci: ci.level,
              api: api.level,
              frontend: frontend.level,
            };
            const snapshot = {
              checkedAt: new Date().toISOString(),
              pr: {
                number: pr.number,
                state: pr.state,
                merged: pr.merged,
                url: pr.html_url,
                headSha,
                mergeCommitSha: pr.merge_commit_sha || null,
              },
              ci,
              api,
              frontend,
              levels,
            };

            const ciDetail = ci.counts.total + ' checks; ' + ci.counts.passed +
              ' passed, ' + ci.counts.failed + ' failed, ' + ci.counts.queued +
              ' queued, ' + ci.counts.inProgress + ' running; required: ' +
              ci.counts.requiredPassed + '/' + ci.counts.requiredTotal +
              ' passed, ' + ci.counts.missingRequired + ' missing, ' +
              ci.counts.requiredPending + ' pending/neutral; combined status: ' +
              ci.combinedState;
            const probeDetail = (result) => result.status === null
              ? result.level + ' (' + (result.error || 'no HTTP response') + ')'
              : result.level + ' (HTTP ' + result.status + ', ' + result.durationMs + ' ms)';

            await core.summary
              .addHeading('RyanAI 30-minute health monitor')
              .addTable([
                [
                  { data: 'Component', header: true },
                  { data: 'State', header: true },
                  { data: 'Evidence', header: true },
                ],
                ['PR #' + pr.number, prLevel, pr.html_url + ' · head ' + headSha.slice(0, 12)],
                ['GitHub CI', ci.level, ciDetail],
                ['Render API', api.level, probeDetail(api)],
                ['Render frontend', frontend.level, probeDetail(frontend)],
              ])
              .addRaw('Checked at ' + snapshot.checkedAt + '. This monitor is read-only: it does not update issues, post comments, deploy services, change configuration, or run migrations.')
              .write();

            core.info('Read-only monitoring snapshot: ' + JSON.stringify(snapshot));
