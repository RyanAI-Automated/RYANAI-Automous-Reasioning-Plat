name: Reusable Vercel Backend Deployment

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Commit SHA to deploy
        required: false
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy validated Vercel backend
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Verify deployment commit signature
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_COMMIT: ${{ inputs.commit_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEPLOY_COMMIT}")"
          verified="$(printf '%s' "$response" | jq -r '.commit.verification.verified')"
          reason="$(printf '%s' "$response" | jq -r '.commit.verification.reason // "unknown"')"
          if [[ "$verified" != "true" ]]; then
            echo "::error::Refusing Vercel deployment: commit ${DEPLOY_COMMIT} is not cryptographically verified (${reason})."
            exit 1
          fi

      - name: Require the Vercel backend runtime contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d api ]] || ! find api -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.ts' \) -print -quit | grep -q .; then
            echo "::error::Vercel backend deployment is blocked: no root api/ serverless function entrypoint exists yet."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (config.framework === 'vite' || config.outputDirectory) {
            console.error('::error::Vercel is still configured as a static Vite frontend. The accepted hybrid topology requires Render frontend delivery and Vercel backend functions.');
            process.exit(1);
          }
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate Vercel deployment credentials
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Set the VERCEL_TOKEN repository secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::Set the VERCEL_ORG_ID repository secret"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Set the VERCEL_PROJECT_ID repository secret"; exit 1; }

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Pull Vercel production configuration
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel backend output
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Vercel backend output
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
