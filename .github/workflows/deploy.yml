name: Reusable Vercel Production Deployment

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Commit SHA to deploy
        required: false
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Vite frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate deployment configuration
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Set the VERCEL_TOKEN repository secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::Set the VERCEL_ORG_ID repository secret"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Set the VERCEL_PROJECT_ID repository secret"; exit 1; }
          test -n "$VITE_API_BASE_URL" || { echo "::error::Set VITE_API_BASE_URL to the deployed API origin"; exit 1; }

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify web build command
        run: npm run build:web

      - name: Pull Vercel production configuration
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production output
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production output
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
