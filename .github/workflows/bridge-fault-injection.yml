name: Connectivity Bridge Fault Injection

on:
  pull_request:
    paths:
      - 'connectivity-bridge/**'
      - 'docker-compose.yml'
      - 'src/api/connectivityBridge.ts'
      - 'src/api/connectivityBridge.test.ts'
      - 'src/components/ConnectivityBridgeRuntime.tsx'
      - 'src/App.tsx'
      - 'app/page.tsx'
      - 'Dockerfile'
      - 'nginx.conf.template'
      - 'vite.config.ts'
      - '.env.example'
      - 'package.json'
      - 'src/components/ConnectivityBridgeRuntime.tsx'
      - 'src/server/connectivityBridgeAdapter.ts'
      - 'src/server/launcher.ts'
      - 'mcp-server/**'
      - '.github/workflows/bridge-fault-injection.yml'
  push:
    branches: [main]
    paths:
      - 'connectivity-bridge/**'
      - 'connectivity-bridge/Dockerfile'
      - 'docker-compose.yml'
      - 'src/api/connectivityBridge.ts'
      - 'src/server/routes/auth.ts'
      - 'src/server/launcher.ts'
      - 'mcp-server/**'

permissions:
  contents: read

jobs:
  bridge-fault-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Redis for restart and AOF recovery tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run bridge protocol and fault-injection tests
        run: npm run test:bridge
