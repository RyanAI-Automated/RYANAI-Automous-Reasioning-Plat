name: Pull Request Preview Build

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.*'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build read-only preview artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web preview
        run: npm run build:web

      - name: Verify preview output
        run: test -s dist/index.html

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryanai-preview-${{ github.event.pull_request.number || github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
