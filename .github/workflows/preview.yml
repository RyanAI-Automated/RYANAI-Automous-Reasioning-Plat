name: Pull Request Vercel Preview

# Validate code for Vercel compatibility without a second deployment path.
# Actual PR previews are delegated to the Vercel Git integration.
on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vercel-preview:
    name: Validate preview build (no deployment secrets)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: "true"
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify npm lockfile
        run: test -f package-lock.json

      - name: Install locked dependencies without deployment credentials
        run: npm ci --legacy-peer-deps

      - name: Typecheck and build preview artifact
        run: npm run typecheck && npm run build:web

      - name: Document deployment ownership
        run: echo "Build validation only. Actual pull-request previews are handled by the Vercel Git integration."
