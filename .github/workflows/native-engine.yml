name: Native Rust and C++ CI

on:
  push:
    branches: [main, master]
    paths:
      - "native/**"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/native-engine.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "native/**"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/native-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, lint, test, and build Rust apps
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev libgtk-3-dev libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Validate all Rust manifests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' manifests < <(find . -type f -name Cargo.toml -not -path '*/target/*' -not -path '*/node_modules/*' -print0)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No Cargo.toml files were found."
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            dir="$(dirname "$manifest")"
            echo "Validating Rust package in $dir"
            cargo fmt --manifest-path "$manifest" --all -- --check
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
            cargo test --manifest-path "$manifest" --release
            cargo build --manifest-path "$manifest" --release
          done

  cpp:
    name: Build local C++ inference target
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Configure C++ project
        run: cmake -S native/local-inference -B "$RUNNER_TEMP/ryanai-local-inference" -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ target
        run: cmake --build "$RUNNER_TEMP/ryanai-local-inference" --config Release --parallel 2
