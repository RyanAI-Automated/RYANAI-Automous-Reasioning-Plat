name: CI - Build, Test, and Integrate

on:
  push:
    branches: [main, master, dev, develop, feat/railway-deployment-support]
  pull_request:
    branches: [main, master, dev, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep one active run and only the latest pending run per workflow/ref.
  # Do not include github.sha: that creates a separate concurrency group
  # for every main/master push and defeats branch-level serialization.
  # Serialize each workflow/ref. A stable main group prevents every push SHA
  # from creating an independent queue of runners. GitHub retains only the
  # latest pending run per group while allowing the active run to finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  validate:
    name: Validate (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Settings enhancement regression tests
        run: >-
          npx vitest run
          src/shared/dashboardUis.test.ts
          src/pages/Dashboard.test.tsx
          src/pages/ProfileSettings.test.tsx
          src/App.test.tsx
      - name: Run plugin integrations centre regression tests
        run: npx vitest run src/components/PluginIntegrationsSettings.test.tsx
      - name: Typecheck API independently of application lint
        run: npm run build:server

      - name: Validate application
        run: npm run validate

      - name: Validate Python tooling
        run: npm run core:check

      - name: Validate GitHub workflows
        run: npm run workflow:validate

      - name: Audit optional deployment readiness and agent inventory
        env:
          AWS_ECS_DEPLOY_ENABLED: ${{ vars.AWS_ECS_DEPLOY_ENABLED }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
          ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          AZURE_AKS_DEPLOY_ENABLED: ${{ vars.AZURE_AKS_DEPLOY_ENABLED }}
          AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          AZURE_CONTAINER_NAME: ${{ vars.AZURE_CONTAINER_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CLUSTER_NAME: ${{ vars.AZURE_CLUSTER_NAME }}
          AZURE_KUSTOMIZE_PATH: ${{ vars.AZURE_KUSTOMIZE_PATH }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}
          DATADOG_SYNTHETICS_ENABLED: ${{ vars.DATADOG_SYNTHETICS_ENABLED }}
          DD_API_KEY: ${{ secrets.DD_API_KEY != '' }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY != '' }}
          RENDER_DEPLOY_ENABLED: ${{ vars.RENDER_DEPLOY_ENABLED }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY != '' }}
          VITE_API_BASE_URL: https://ryanai-api.onrender.com
          # Pass only boolean presence indicators; never expose model API keys to audit processes.
          RYANAI_NVIDIA_KEY_CONFIGURED: ${{ secrets.NVIDIA_API_KEY != '' }}
          RYANAI_QWEN_KEY_CONFIGURED: ${{ secrets.QWEN_API_KEY != '' }}
          RYANAI_LOGIC_KEY_CONFIGURED: ${{ secrets.LOGIC_API_KEY != '' }}
          RYANAI_LM_STUDIO_KEY_CONFIGURED: ${{ secrets.LM_STUDIO_API_KEY != '' }}
          RYANAI_OPENAI_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
          RYANAI_LM_STUDIO_URL_CONFIGURED: ${{ vars.LM_STUDIO_URL != '' }}
          RYANAI_OLLAMA_URL_CONFIGURED: ${{ vars.OLLAMA_URL != '' }}
          RYANAI_NVIDIA_ENDPOINT_CONFIGURED: ${{ vars.NVIDIA_API_ENDPOINT != '' }}
          RYANAI_QWEN_ENDPOINT_CONFIGURED: ${{ vars.QWEN_API_ENDPOINT != '' }}
          RYANAI_LOGIC_USES_LM_STUDIO: ${{ vars.LM_STUDIO_URL != '' && (vars.LOGIC_API_ENDPOINT == '' || vars.LOGIC_API_ENDPOINT == vars.LM_STUDIO_URL) }}
        run: npm run test:readiness-audits && npm run audit:deployments && npm run audit:agents

  subprojects:
    name: MCP server and workflow worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mcp-server/package-lock.json
            workflows-ryanai/package-lock.json

      - name: Check standalone MCP server
        run: npm ci --prefix mcp-server && npm --prefix mcp-server run check

      - name: Build workflow worker
        run: npm ci --prefix workflows-ryanai && npm --prefix workflows-ryanai run build

  integration:
    name: Integration and end-to-end checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ryanai
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ryanai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ryanai -d ryanai_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: '3000'
      DATABASE_URL: postgresql://ryanai:ci_password@127.0.0.1:5432/ryanai_db
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci_only_secret_at_least_32_characters_long
      OPENAI_API_KEY: ''
      API_BASE_URL: http://127.0.0.1:3000
      WEB_BASE_URL: http://127.0.0.1:9090
      # Optional live-auth E2E checks run only when dedicated CI test tokens are configured.
      TEST_USER_ACCESS_TOKEN: ${{ github.event_name == 'push' && secrets.TEST_USER_ACCESS_TOKEN || '' }}
      TEST_ADMIN_ACCESS_TOKEN: ${{ github.event_name == 'push' && secrets.TEST_ADMIN_ACCESS_TOKEN || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        # Prisma CLI is a dev dependency required by db:setup, even though the service runs in production mode.
        run: npm ci --include=dev --legacy-peer-deps

      - name: Prepare disposable PostgreSQL with Supabase Auth compatibility
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY,
            email text,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now()
          );
          SQL

      - name: Prepare database
        run: npm run db:setup

      - name: Verify durable agent queue claims and lease recovery against disposable PostgreSQL
        run: node --import tsx/esm scripts/test-agent-queue.mjs

      # Vite's build uses emptyOutDir=true and clears dist/. Build the frontend
      # first, then compile the API so the server output survives for startup.
      - name: Build frontend and API
        run: |
          npm run build:client
          npm run build:server
          test -s dist/server/server/launcher.js

      - name: Verify production startup failure and recovery against disposable services
        run: node --test scripts/redis-probe.test.mjs && node scripts/test-startup-resilience.mjs && npx vitest run src/server/startupConfig.test.ts

      - name: Start services and run integration checks
        shell: bash
        run: |
          set -euo pipefail
          npm run start > api.log 2>&1 &
          api_pid=$!
          # The MCP health check is part of startup verification, so start the
          # standalone HTTP manager explicitly in CI before running that check.
          MCP_HOST=127.0.0.1 MCP_PORT=8765 npm --prefix mcp-server run start:http > mcp.log 2>&1 &
          mcp_pid=$!
          # Vite's preview proxy reads this setting at runtime. Point it at the
          # API started above (port 3000), not the local-development default (3001).
          VITE_API_BASE_URL=http://127.0.0.1:3000 npm run preview -- --host 127.0.0.1 --port 9090 > web.log 2>&1 &
          web_pid=$!
          cleanup() {
            kill "$api_pid" "$mcp_pid" "$web_pid" 2>/dev/null || true
            wait "$api_pid" "$mcp_pid" "$web_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for the API health endpoint..."
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              echo "API is healthy."
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/health > /dev/null

          echo "Waiting for the MCP HTTP health endpoint..."
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > /dev/null; then
              echo "MCP HTTP service is healthy."
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8765/health > /dev/null

          npm run startup:verify
          npm run test:integration
          npm run test:e2e

      - name: Print service logs on failure
        if: failure()
        shell: bash
        run: |
          echo "::group::API log"
          if [ -f api.log ]; then cat api.log; else echo "api.log was not created"; fi
          echo "::endgroup::"
          echo "::group::Web log"
          if [ -f web.log ]; then cat web.log; else echo "web.log was not created"; fi
          echo "::endgroup::"
          echo "::group::MCP log"
          if [ -f mcp.log ]; then cat mcp.log; else echo "mcp.log was not created"; fi
          echo "::endgroup::"

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            api.log
            web.log
            mcp.log
          if-no-files-found: warn
          retention-days: 7

  issue-435-supabase:
    name: Issue 435 migrations and attachment security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Run focused attachment and grants tests
        run: |
          npx vitest run \
            src/lib/leastPrivilegeGrantsMigration.test.ts \
            src/lib/attachmentStoragePolicy.test.ts \
            src/lib/attachmentQuotaMigration.test.ts \
            src/lib/attachmentUpdateGuardMigration.test.ts \
            src/lib/attachmentSignedUploadReservationMigration.test.ts \
            src/lib/attachments.test.ts \
            src/server/attachments/scanner.test.ts
      - name: Set up pinned Supabase CLI
        id: setup_supabase_cli
        uses: supabase/setup-cli@v3.1.0
        with:
          version: 2.120.0
      - name: Start isolated local Supabase stack
        run: supabase start -x studio,mailpit,edge-runtime,logflare,vector
      - name: Apply all migrations to a fresh local database
        run: |
          set -euo pipefail
          supabase db reset --local
          supabase migration list --local | tee /tmp/fresh-migration-list.txt
          for version in \
            20261030120000 20261030130000 20261030140000 \
            20261031100000 20261031110000 20261031120000 \
            20261031130000 20261031150000 20261105130000 20261105193000 99999999999999; do
            grep -F "$version" /tmp/fresh-migration-list.txt
          done
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM storage.buckets WHERE id = 'ryanai-attachments' AND public = false) THEN
              RAISE EXCEPTION 'RyanAI attachment bucket is missing or public';
            END IF;
            IF has_table_privilege('anon', 'public.profiles', 'SELECT') THEN
              RAISE EXCEPTION 'anon unexpectedly has SELECT on profiles';
            END IF;
            IF NOT has_table_privilege('authenticated', 'public.profiles', 'SELECT') THEN
              RAISE EXCEPTION 'authenticated is missing SELECT on profiles';
            END IF;
            IF NOT has_table_privilege('authenticated', 'public.ryanai_attachment_scans', 'SELECT') THEN
              RAISE EXCEPTION 'authenticated is missing read-only scan visibility';
            END IF;
            IF has_table_privilege('authenticated', 'public.ryanai_attachment_scans', 'INSERT') THEN
              RAISE EXCEPTION 'authenticated unexpectedly has INSERT on scan state';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_default_acl d
              CROSS JOIN LATERAL aclexplode(d.defaclacl) a
              WHERE d.defaclrole = 'postgres'::regrole
                AND d.defaclnamespace = 'public'::regnamespace
                AND d.defaclobjtype = 'r'
                AND a.grantee IN (0, 'anon'::regrole, 'authenticated'::regrole)
            ) THEN
              RAISE EXCEPTION 'public default table ACL grants client access';
            END IF;
          END $$;
          SQL
      - name: Simulate recorded far-future legacy migration and apply corrective migration
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          # This fixture changes only the disposable CI database.
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE r record;
          BEGIN
            FOR r IN SELECT schemaname, tablename FROM pg_tables WHERE schemaname = 'public'
            LOOP
              EXECUTE format('REVOKE ALL PRIVILEGES ON TABLE %I.%I FROM PUBLIC, anon, authenticated', r.schemaname, r.tablename);
            END LOOP;
          END $$;
          DELETE FROM supabase_migrations.schema_migrations WHERE version = '20261031150000';
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM supabase_migrations.schema_migrations
              WHERE version = '99999999999999'
            ) THEN
              RAISE EXCEPTION 'legacy far-future migration is not recorded';
            END IF;
            IF EXISTS (
              SELECT 1 FROM supabase_migrations.schema_migrations
              WHERE version = '20261031150000'
            ) THEN
              RAISE EXCEPTION 'corrective migration unexpectedly remains recorded before simulation';
            END IF;
          END $$;
          SQL
          # The CLI Local column is a file inventory, not a ledger assertion.
          # Apply the missing timestamp despite the recorded far-future entry.
          supabase migration up --local --include-all
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM supabase_migrations.schema_migrations
              WHERE version = '20261031150000'
            ) THEN
              RAISE EXCEPTION 'corrective migration was not recorded after include-all';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM supabase_migrations.schema_migrations
              WHERE version = '99999999999999'
            ) THEN
              RAISE EXCEPTION 'legacy far-future migration ledger entry was lost';
            END IF;
          END $$;
          SQL
          supabase migration list --local
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF has_table_privilege('anon', 'public.profiles', 'SELECT') THEN
              RAISE EXCEPTION 'anon regained SELECT after corrective migration';
            END IF;
            IF NOT has_table_privilege('authenticated', 'public.profiles', 'SELECT') THEN
              RAISE EXCEPTION 'authenticated profile SELECT was not restored';
            END IF;
            IF NOT has_table_privilege('authenticated', 'public.ryanai_attachment_scans', 'SELECT') THEN
              RAISE EXCEPTION 'authenticated scan SELECT was not restored';
            END IF;
            IF has_table_privilege('authenticated', 'public.ryanai_attachment_scans', 'INSERT') THEN
              RAISE EXCEPTION 'authenticated gained scan INSERT';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_default_acl d
              CROSS JOIN LATERAL aclexplode(d.defaclacl) a
              WHERE d.defaclrole = 'postgres'::regrole
                AND d.defaclnamespace = 'public'::regnamespace
                AND d.defaclobjtype = 'r'
                AND a.grantee IN (0, 'anon'::regrole, 'authenticated'::regrole)
            ) THEN
              RAISE EXCEPTION 'public default table ACL grants client access';
            END IF;
          END $$;
          SQL
      - name: Generate Prisma clients for Comms integration
        run: npm run db:generate
      - name: Run Comms PostgreSQL callback and attachment scanner integration tests
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export DATABASE_URL="$DB_URL"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npx prisma migrate deploy
          npm run test:comms-callback:integration
          npm run test:comms-attachments:integration
      - name: Verify PostgreSQL LISTEN/NOTIFY and reasoning worker recovery
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export RYANAI_NOTIFICATION_TEST_DATABASE_URL="$DB_URL"
          export NODE_ENV=test
          npm run test:agent-notifications
      - name: Stop isolated Supabase stack
        if: always() && steps.setup_supabase_cli.outcome == 'success'
        run: supabase stop --no-backup

  render-api-config-repair:
    name: Repair Render API configuration (no deployment)
    needs: [validate, subprojects, integration, issue-435-supabase]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Verify exact current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid commit SHA"; exit 1; }
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "$TARGET_SHA" == "$MAIN_SHA" ]] || { echo "::error::Commit is no longer current main; no Render change made"; exit 1; }

      - name: Require successful independent security checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Core validate already runs npm run validate and workflow:validate.
          # The separate config workflow is path-filtered; do not wait for it here.
          required=(
            "Test agent API contracts"
            "Dependency audit"
            "Trivy filesystem scan"
            "Analyze (javascript-typescript)"
            "Analyze (python)"
            "TruffleHog secret audit"
            "Codacy Security Scan"
          )
          ready=false
          for attempt in $(seq 1 40); do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" > checks-pages.json
            jq -s '[.[].check_runs[]]' checks-pages.json > checks.json
            missing=0
            pending=0
            failed=0
            for name in "${required[@]}"; do
              check="$(jq -c --arg n "$name" '[.[] | select(.name == $n)] | sort_by(.id) | last // empty' checks.json)"
              if [[ -z "$check" ]]; then
                missing=$((missing + 1))
                continue
              fi
              state="$(jq -r '.status' <<<"$check")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$check")"
              if [[ "$state" != "completed" ]]; then
                pending=$((pending + 1))
              elif [[ "$conclusion" != "success" ]]; then
                failed=$((failed + 1))
                echo "::error::Required check failed: $name ($conclusion)"
              fi
            done
            [[ "$failed" -eq 0 ]] || exit 1
            if [[ "$missing" -eq 0 && "$pending" -eq 0 ]]; then
              ready=true
              break
            fi
            echo "Waiting for security/configuration checks: $missing missing, $pending pending (attempt $attempt/40)"
            sleep 30
          done
          [[ "$ready" == true ]] || { echo "::error::Required security/configuration checks did not all pass"; exit 1; }

      - name: Confirm Render API credential is available
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$RENDER_API_KEY" ]] || { echo "::error::RENDER_API_KEY is missing; no Render change made"; exit 1; }

      - name: Read current API service settings
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --url "https://api.render.com/v1/services/srv-dbk4giu7bikc7394a4r0" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "accept: application/json" \
            --output render-service-before.json

      - name: Correct service source and Docker settings without deploying
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          desired='
            .repo == "https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat" and
            .branch == "main" and
            .rootDir == "." and
            .autoDeployTrigger == "off" and
            .serviceDetails.envSpecificDetails.dockerContext == "." and
            .serviceDetails.envSpecificDetails.dockerfilePath == "./Dockerfile.api" and
            (.serviceDetails.envSpecificDetails.dockerCommand // "") == "" and
            .serviceDetails.healthCheckPath == "/health"
          '
          if jq -e "$desired" render-service-before.json >/dev/null; then
            echo "Render API already matches the expected configuration; no PATCH required."
          else
            curl --fail-with-body --silent --show-error \
              --request PATCH \
              --url "https://api.render.com/v1/services/srv-dbk4giu7bikc7394a4r0" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "accept: application/json" \
              --header "content-type: application/json" \
              --data '{"repo":"https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat","branch":"main","rootDir":".","autoDeployTrigger":"off","serviceDetails":{"dockerContext":".","dockerfilePath":"./Dockerfile.api","dockerCommand":"","healthCheckPath":"/health"}}' \
              --output render-service-update.json
            jq -e "$desired" render-service-update.json
          fi

      - name: Read back and verify repaired API settings
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --url "https://api.render.com/v1/services/srv-dbk4giu7bikc7394a4r0" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "accept: application/json" \
            --output render-service-final.json
          jq -e '
            .repo == "https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat" and
            .branch == "main" and
            .rootDir == "." and
            .autoDeployTrigger == "off" and
            .serviceDetails.envSpecificDetails.dockerContext == "." and
            .serviceDetails.envSpecificDetails.dockerfilePath == "./Dockerfile.api" and
            (.serviceDetails.envSpecificDetails.dockerCommand // "") == "" and
            .serviceDetails.healthCheckPath == "/health"
          ' render-service-final.json
          echo "Render API configuration corrected and read back. No deploy endpoint was called."
          echo "API deployment remains disabled."
