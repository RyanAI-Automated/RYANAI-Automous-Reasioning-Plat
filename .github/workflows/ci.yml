name: CI - Build, Test, and Integrate

on:
  push:
    branches: [main, master, dev, develop]
  pull_request:
    branches: [main, master, dev, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  validate:
    name: Validate (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate application
        run: npm run validate

      - name: Validate Python tooling
        run: npm run core:check

      - name: Validate GitHub workflows
        run: npm run workflow:validate

  subprojects:
    name: MCP server and workflow worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mcp-server/package-lock.json
            workflows-ryanai/package-lock.json

      - name: Check standalone MCP server
        run: npm ci --prefix mcp-server && npm --prefix mcp-server run check

      - name: Build workflow worker
        run: npm ci --prefix workflows-ryanai && npm --prefix workflows-ryanai run build

  integration:
    name: Integration and end-to-end checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ryanai
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ryanai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ryanai -d ryanai_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: '3000'
      DATABASE_URL: postgresql://ryanai:ci_password@127.0.0.1:5432/ryanai_db
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci_only_secret_at_least_32_characters_long
      OPENAI_API_KEY: ''
      API_BASE_URL: http://127.0.0.1:3000
      WEB_BASE_URL: http://127.0.0.1:9090

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Prepare database
        run: npm run db:setup

      - name: Build API and frontend
        run: npm run build:server && npm run build:client

      - name: Start services and run integration checks
        shell: bash
        run: |
          set -euo pipefail
          npm run start > api.log 2>&1 &
          api_pid=$!
          npm run preview -- --host 127.0.0.1 --port 9090 > web.log 2>&1 &
          web_pid=$!
          cleanup() {
            kill "$api_pid" "$web_pid" 2>/dev/null || true
            wait "$api_pid" "$web_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for the API health endpoint..."
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              echo "API is healthy."
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/health > /dev/null

          npm run startup:verify
          npm run test:integration
          npm run test:e2e

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          path: |
            api.log
            web.log
          retention-days: 7
