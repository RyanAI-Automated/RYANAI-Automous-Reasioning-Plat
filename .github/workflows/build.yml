name: Build (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Frontend, API, and workflow builds
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4[cite: 7]
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        uses: actions/setup-node@v4[cite: 7]
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps[cite: 7]

      - name: Validate and build root application
        run: npm run validate[cite: 7]

      - name: Build standalone MCP manager
        run: npm ci --prefix mcp-server && npm --prefix mcp-server run check[cite: 7]

      - name: Build workflow worker
        run: npm ci --prefix workflows-ryanai && npm --prefix workflows-ryanai run build[cite: 7]
        run: npm ci --prefix workflows-ryanai && npm --prefix workflows-ryanai run build
