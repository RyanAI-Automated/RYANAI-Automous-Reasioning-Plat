name: Docker - Build and Publish Images

# Pull requests build every image without publishing.
# Pushes to the default branch (and version tags) publish to GitHub Container Registry.
on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'mcp-server/**'
      - 'docker-compose.yml'
      - 'docker-entrypoint.sh'
      - 'nginx.conf'
      - 'nginx.conf.template'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'prisma/**'
      - 'models/**'
      - 'app/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    name: ${{ github.event_name == 'pull_request' && 'Build' || 'Build and publish' }} ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: Dockerfile
            target: api
          - image: web
            file: Dockerfile
            target: web
          - image: mcp
            file: mcp-server/Dockerfile
            target: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE: ${{ matrix.image }}
        run: |
          repo_lower=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${repo_lower}/${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build${{ github.event_name != 'pull_request' && ' and publish' || '' }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
