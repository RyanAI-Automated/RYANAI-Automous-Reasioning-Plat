# Namespace for the RyanAI stack.
# Create secrets out-of-band (never commit real values):
# Set these in a trusted shell/session; do not commit their values:
#   DB_PASSWORD, REDIS_PASSWORD, DATABASE_URL, REDIS_URL, JWT_SECRET
# Then create the secret out-of-band:
#   kubectl -n ryanai-system create secret generic ryanai-secrets \
#     --from-literal=DB_PASSWORD="$DB_PASSWORD" \
#     --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
#     --from-literal=DATABASE_URL="$DATABASE_URL" \
#     --from-literal=REDIS_URL="$REDIS_URL" \
#     --from-literal=JWT_SECRET="$JWT_SECRET"
apiVersion: v1
kind: Namespace
metadata:
  name: ryanai-system
---
# Images are published by .github/workflows/ci-cd.yml.
# Add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY to ryanai-secrets for sign-in.
# Build the web image with matching public VITE_SUPABASE_* settings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/rmnganyane-dev/ryanai-automous-reasioning-plat/api:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: ryanai-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/rmnganyane-dev/ryanai-automous-reasioning-plat/web:latest
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PORT
              value: "80"
            - name: API_HOST
              value: api
            - name: API_PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
