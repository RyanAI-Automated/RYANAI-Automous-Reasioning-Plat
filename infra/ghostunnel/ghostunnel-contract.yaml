schema_version: 1
component: ghostunnel
project: RyanAI
status: evaluation_only
release:
  image: ghostunnel/ghostunnel:v1.11.5-distroless
  version: v1.11.5
  version_pinning_required: true
  mutable_tags_forbidden: true
rollout:
  enabled_by_default: false
  production_activation_allowed: false
  runtime_wiring_allowed_in_this_phase: false
  staging_pilot_requires_separate_approval: true
  deployment_changes_authorized: false
identity:
  mutual_tls_required: true
  client_certificate_required: true
  preferred_identity: spiffe_uri_san
  certificate_authority_required: true
  allow_all_forbidden: true
  disable_authentication_forbidden: true
  common_name_only_identity_forbidden: true
  certificate_private_keys_in_repository_forbidden: true
network:
  public_listener_forbidden: true
  host_port_publication_forbidden: true
  unsafe_listen_override_forbidden: true
  unsafe_target_override_forbidden: true
  status_endpoint_loopback_only: true
authorization:
  gen_x_remains_authority: true
  certificate_identity_is_not_action_authorization: true
  opa_policy_changes_require_review: true
  fail_closed_on_missing_or_invalid_identity: true
operations:
  certificate_rotation_required: true
  certificate_expiry_monitoring_required: true
  revocation_or_trust_bundle_replacement_test_required: true
  connection_failure_metrics_required: true
  secret_and_payload_redaction_required: true
  rollback_plan_required: true
  health_check_must_not_claim_application_health: true
acceptance:
  negative_certificate_tests_required: true
  unknown_identity_rejected: true
  expired_certificate_rejected: true
  wrong_ca_rejected: true
  client_without_certificate_rejected: true
  positive_mtls_handshake_required: true
  application_protocol_smoke_test_required: true
  measured_latency_and_resource_baseline_required: true
  rollback_test_required: true
  evidence_commit_sha_required: true
  human_approval_required_before_staging_or_production: true
