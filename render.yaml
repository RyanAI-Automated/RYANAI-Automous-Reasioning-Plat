# RyanAI production Render Blueprint.
# Preserve the current static frontend while adding a Docker/Nginx canary.
# Promote the Docker service only after its end-to-end checks pass.
version: "1"

previews:
  generation: "off"

services:
  # Existing static frontend retained as rollback during Docker canary validation.
  - type: web
    name: ryanai-web
    runtime: static
    repo: https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat
    branch: main
    rootDir: .
    autoDeployTrigger: "off"
    buildCommand: npm ci --legacy-peer-deps && npm run build:web
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ryanai-api.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://narsvpwymvlrhurqbthu.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_APP_ENV
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Docker/Nginx canary uses the root Dockerfile's final "web" stage.
  # VITE_API_BASE_URL is intentionally unset: apiBaseUrl.ts falls back to
  # window.location.origin, and nginx proxies /api/* and /ws to the private API.
  - type: web
    name: ryanai-web-docker-canary
    runtime: docker
    repo: https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat
    branch: main
    rootDir: .
    region: oregon
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerCommand: ""
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: API_HOST
        fromService:
          name: ryanai-api
          type: web
          property: host
      - key: API_PORT
        fromService:
          name: ryanai-api
          type: web
          property: port
      - key: VITE_SUPABASE_URL
        value: https://narsvpwymvlrhurqbthu.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        fromService:
          name: ryanai-web
          type: web
          envVarKey: VITE_SUPABASE_PUBLISHABLE_KEY
      - key: VITE_APP_ENV
        value: production

  - type: web
    name: ryanai-api
    runtime: docker
    repo: https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat
    branch: main
    rootDir: .
    region: oregon
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile.api
    # The runtime image intentionally removes npm/npx and prunes dev dependencies.
    # Do not run npx prisma migrate deploy from this image.
    dockerCommand: ""
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: https://ryanai-web.onrender.com,https://ryanai-web-docker-canary.onrender.com,https://ryanai-automous-reasoning-plat-uss1632.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: ryanai-redis
          type: keyvalue
          property: connectionString
      - key: SUPABASE_URL
        value: https://narsvpwymvlrhurqbthu.supabase.co
      # Pooler cluster index cannot be derived from region. Copy the exact host from Supabase Connect > Session pooler.
      # Dedicated Neon database for audiobook API persistence; never substitute DATABASE_URL.
      - key: AUDIOBOOK_DATABASE_URL
        sync: false
      - key: SUPABASE_SESSION_POOLER_HOST
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Keep uploads unavailable until a reachable ClamAV service is provisioned.
      - key: ATTACHMENT_SCANNER_ENABLED
        value: "false"
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: "3310"
      - key: CLAMAV_TIMEOUT_MS
        value: "60000"
      - key: OPENAI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_API_ENDPOINT
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: QWEN_API_KEY
        sync: false
      - key: QWEN_API_ENDPOINT
        value: https://api.together.xyz/v1
      - key: QWEN_MODEL
        value: Qwen/Qwen3-235B-A22B-Instruct-2507-tput
      - key: LOGIC_API_KEY
        sync: false
      - key: LOGIC_API_ENDPOINT
        value: https://api.openai.com/v1
      - key: LOGIC_REASONING_MODEL
        value: gpt-4o-mini
      - key: RYANAI_GITHUB_TOKEN
        sync: false
      - key: RYANAI_GITHUB_REPOSITORY
        value: RyanAI-Automated/RYANAI-Automous-Reasioning-Plat
      - key: RYANAI_GITHUB_BASE_BRANCH
        value: main
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_CONTENT_SID
        sync: false
      - key: TWILIO_WHATSAPP_WEBHOOK_URL
        sync: false
      - key: TWILIO_SMS_WEBHOOK_URL
        sync: false
      - key: TWILIO_VOICE_WEBHOOK_URL
        sync: false
      - key: TWILIO_VOICE_ACTION_URL
        sync: false
      - key: TWILIO_STATUS_WEBHOOK_URL
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: notifications@ryanai.org
      - key: RYANAI_OWNER_TITLE
        value: Sir G
      - key: RYANAI_OWNER_LANGUAGE
        value: ve-ZA
      - key: RYANAI_OWNER_PHONE
        sync: false
      - key: RYANAI_OWNER_EMAIL
        sync: false

  - type: keyvalue
    name: ryanai-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []
