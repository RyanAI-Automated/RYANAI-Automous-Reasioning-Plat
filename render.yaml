# RyanAI Production Blueprint
# Vercel serves the frontend; Render hosts persistent API and MCP services.
version: "1"

projects:
  - name: RyanAI Autonomous
    environments:
      - name: Production
        services:
          - type: web
            name: ryanai-api
            runtime: docker
            repo: https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat
            branch: main
            plan: free
            region: oregon
            dockerContext: .
            dockerfilePath: ./Dockerfile.api
            autoDeployTrigger: "off"
            healthCheckPath: /health
            envVars:
              - key: NODE_ENV
                value: production
              - key: HOST
                value: 0.0.0.0
              - key: PORT
                value: "10000"
              - key: CORS_ORIGINS
                value: https://www.ryan.co.za,https://ryan.co.za,https://ryanai-automous-reasioning-plat.vercel.app
              - key: JWT_SECRET
                generateValue: true
              - key: DATABASE_URL
                sync: false
              - key: REDIS_URL
                fromService:
                  name: ryanai-redis
                  type: keyvalue
                  property: connectionString
              - key: SUPABASE_URL
                value: https://narsvpwymvlrhurqbthu.supabase.co
              - key: SUPABASE_PUBLISHABLE_KEY
                sync: false
              - key: SUPABASE_SERVICE_ROLE_KEY
                sync: false
              - key: ATTACHMENT_SCANNER_ENABLED
                value: "false"
              - key: CLAMAV_HOST
                sync: false
              - key: CLAMAV_PORT
                value: "3310"
              - key: CLAMAV_TIMEOUT_MS
                value: "60000"
              - key: OPENAI_API_KEY
                sync: false
              - key: NVIDIA_API_KEY
                sync: false
              - key: NVIDIA_API_ENDPOINT
                value: https://integrate.api.nvidia.com/v1
              - key: NVIDIA_MODEL
                value: nvidia/nemotron-3-ultra-550b-a55b
              - key: QWEN_API_KEY
                sync: false
              - key: QWEN_API_ENDPOINT
                value: https://api.together.xyz/v1
              - key: QWEN_MODEL
                value: Qwen/Qwen3-235B-A22B-Instruct-2507-tput
              - key: LOGIC_API_KEY
                sync: false
              - key: LOGIC_API_ENDPOINT
                value: https://api.openai.com/v1
              - key: LOGIC_REASONING_MODEL
                value: gpt-4o-mini
              - key: RYANAI_GITHUB_TOKEN
                sync: false
              - key: RYANAI_GITHUB_REPOSITORY
                value: RyanAI-Automated/RYANAI-Automous-Reasioning-Plat
              - key: RYANAI_GITHUB_BASE_BRANCH
                value: main
              - key: TWILIO_ACCOUNT_SID
                sync: false
              - key: TWILIO_AUTH_TOKEN
                sync: false
              - key: TWILIO_PHONE_NUMBER
                sync: false
              - key: TWILIO_WHATSAPP_NUMBER
                sync: false
              - key: TWILIO_WHATSAPP_CONTENT_SID
                sync: false
              - key: TWILIO_WHATSAPP_WEBHOOK_URL
                sync: false
              - key: TWILIO_SMS_WEBHOOK_URL
                sync: false
              - key: TWILIO_VOICE_WEBHOOK_URL
                sync: false
              - key: TWILIO_VOICE_ACTION_URL
                sync: false
              - key: TWILIO_STATUS_WEBHOOK_URL
                sync: false
              - key: TWILIO_STATUS_CALLBACK_URL
                sync: false
              - key: RESEND_API_KEY
                sync: false
              - key: RESEND_WEBHOOK_SECRET
                sync: false
              - key: SMTP_HOST
                sync: false
              - key: SMTP_PORT
                sync: false
              - key: SMTP_SECURE
                sync: false
              - key: SMTP_USER
                sync: false
              - key: SMTP_PASS
                sync: false
              - key: SMTP_FROM
                sync: false
              - key: RYANAI_OWNER_TITLE
                value: Sir G
              - key: RYANAI_OWNER_LANGUAGE
                value: ve-ZA
              - key: RYANAI_OWNER_PHONE
                sync: false
              - key: RYANAI_OWNER_EMAIL
                sync: false
          # Persistent MCP endpoint. Tool access remains operator-allowlisted and disabled by default.
          - type: web
            name: ryanai-mcp
            runtime: docker
            repo: https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat
            branch: main
            plan: free
            region: oregon
            dockerContext: .
            dockerfilePath: ./mcp-server/Dockerfile
            autoDeployTrigger: "off"
            healthCheckPath: /health
            envVars:
              - key: NODE_ENV
                value: production
              - key: MCP_HOST
                value: 0.0.0.0
              - key: MCP_PORT
                value: "8765"
              - key: PORT
                value: "8765"
              - key: MCP_AUTH_TOKEN
                sync: false
              - key: MCP_ALLOWED_HOSTS
                value: ryanai-mcp.onrender.com
              - key: RYANAI_API_HEALTH_URL
                value: http://ryanai-api:10000/health
              - key: RYANAI_MCP_ENABLED_TOOLS
                value: ""
          - type: keyvalue
            name: ryanai-redis
            plan: free
            region: oregon
            maxmemoryPolicy: noeviction
            ipAllowList: [] # Internal access only
