# RyanAI Production Blueprint - Unified & Hardened
version: "1"

services:
  - type: web
    name: ryanai-web
    env: docker
    repo: https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat
    branch: main
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerTarget: web
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ryanai-api.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://narsvpwymvlrhurqbthu.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_APP_ENV
        value: production

  - type: web
- type: web
    name: ryanai-api
    env: docker
    repo: https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat
    branch: main
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /health
    preDeployCommand: npx prisma migrate deploy
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: ryanai-redis
          type: keyvalue
          property: connectionString
      - key: SUPABASE_URL
        value: https://narsvpwymvlrhurqbthu.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: ryanai-redis
          type: keyvalue
          property: connectionString
      - key: SUPABASE_URL
        value: https://narsvpwymvlrhurqbthu.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: COMMUNICATIONS_ENABLED
        value: "true"
      - key: ATTACHMENT_SCANNER_ENABLED
        value: "false"
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: "3310"
      - key: CLAMAV_TIMEOUT_MS
        value: "60000"
      - key: OPENAI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_API_ENDPOINT
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: QWEN_API_KEY
        sync: false
      - key: QWEN_API_ENDPOINT
        value: https://api.together.xyz/v1
      - key: QWEN_MODEL
        value: Qwen/Qwen3-235B-A22B-Instruct-2507-tput
      - key: LOGIC_API_KEY
        sync: false
      - key: LOGIC_API_ENDPOINT
        value: https://api.openai.com/v1
      - key: LOGIC_REASONING_MODEL
        value: gpt-4o-mini
      - key: RYANAI_GITHUB_TOKEN
        sync: false
      - key: RYANAI_GITHUB_REPOSITORY
        value: RyanAI-Automated/RYANAI-Automous-Reasioning-Plat
      - key: RYANAI_GITHUB_BASE_BRANCH
        value: main
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: notifications@ryanai.org
      - key: RYANAI_OWNER_TITLE
        value: Sir G
      - key: RYANAI_OWNER_LANGUAGE
        value: ve-ZA
      - key: RYANAI_OWNER_PHONE
        sync: false
      - key: RYANAI_OWNER_EMAIL
        sync: false

  - type: keyvalue
    name: ryanai-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
