# RyanAI Production Blueprint — reviewed, cost-neutral configuration
# Existing frontend remains a Render Static Site; API remains Dockerfile-based.
# Secrets use sync:false and must be configured privately in Render.
version: "1"

projects:
  - name: RyanAI Autonomous
    environments:
      - name: Production
        services:
          # Existing ryanai-web resource is a Static Site. Do not change its
          # immutable runtime to Docker as part of this update.
          - type: web
            name: ryanai-web
            runtime: static
            repo: https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat
            branch: main
            plan: free
            autoDeployTrigger: "off"
            previews:
              generation: manual
            buildCommand: npm ci --legacy-peer-deps && npm run build
            staticPublishPath: ./dist
            envVars:
              - key: VITE_API_BASE_URL
                value: https://ryanai-api.onrender.com
              - key: VITE_SUPABASE_URL
                value: https://narsvpwymvlrhurqbthu.supabase.co
              - key: VITE_SUPABASE_PUBLISHABLE_KEY
                sync: false
              - key: VITE_SUPABASE_ANON_KEY
                sync: false
              - key: VITE_APP_ENV
                value: production
            routes:
              - type: rewrite
                source: /*
                destination: /index.html

          # Existing ryanai-api resource uses the dedicated API Dockerfile.
          # Render injects PORT, currently 10000; set it explicitly to match
          # the observed service configuration and launcher binding.
          - type: web
            name: ryanai-api
            runtime: docker
            repo: https://github.com/RyanAI-Automated/RYANAI-Automous-Reasioning-Plat
            branch: main
            plan: free
            region: oregon
            dockerContext: .
            dockerfilePath: ./Dockerfile.api
            autoDeployTrigger: "off"
            previews:
              generation: manual
            healthCheckPath: /health
            envVars:
              - key: NODE_ENV
                value: production
              - key: HOST
                value: 0.0.0.0
              - key: PORT
                value: "10000"
              - key: CORS_ORIGINS
                value: "https://ryanai-web.onrender.com,https://ryanai-automous-reasoning-plat-uss1632.vercel.app"
              - key: JWT_SECRET
                generateValue: true
              - key: DATABASE_URL
                sync: false
              - key: REDIS_URL
                fromService:
                  name: ryanai-redis
                  type: keyvalue
                  property: connectionString

              # Supabase — publishable/anon values are not service-role secrets.
              # The service-role key remains API-only and must never use VITE_*.
              - key: SUPABASE_URL
                value: https://narsvpwymvlrhurqbthu.supabase.co
              - key: SUPABASE_ANON_KEY
                sync: false
              - key: SUPABASE_PUBLISHABLE_KEY
                sync: false
              - key: SUPABASE_SERVICE_ROLE_KEY
                sync: false

              # Attachment scanner remains disabled until ClamAV is provisioned.
              - key: ATTACHMENT_SCANNER_ENABLED
                value: "false"
              - key: CLAMAV_HOST
                sync: false
              - key: CLAMAV_PORT
                value: "3310"
              - key: CLAMAV_TIMEOUT_MS
                value: "60000"

              # AI providers — all credentials remain server-side.
              - key: OPENAI_API_KEY
                sync: false
              - key: NVIDIA_API_KEY
                sync: false
              - key: NVIDIA_API_ENDPOINT
                value: https://integrate.api.nvidia.com/v1
              - key: NVIDIA_MODEL
                value: nvidia/nemotron-3-ultra-550b-a55b
              - key: QWEN_API_KEY
                sync: false
              - key: QWEN_API_ENDPOINT
                value: https://api.together.xyz/v1
              - key: QWEN_MODEL
                value: Qwen/Qwen3-235B-A22B-Instruct-2507-tput
              - key: LOGIC_API_KEY
                sync: false
              - key: LOGIC_API_ENDPOINT
                value: https://api.openai.com/v1
              - key: LOGIC_REASONING_MODEL
                value: gpt-4o-mini

              # GitHub access — use a repository-scoped fine-grained token.
              - key: RYANAI_GITHUB_TOKEN
                sync: false
              - key: RYANAI_GITHUB_REPOSITORY
                value: RyanAI-Automated/RYANAI-Automous-Reasioning-Plat
              - key: RYANAI_GITHUB_BASE_BRANCH
                value: main

              # Twilio — WhatsApp, SMS, voice, signature verification and status.
              - key: TWILIO_ACCOUNT_SID
                sync: false
              - key: TWILIO_AUTH_TOKEN
                sync: false
              - key: TWILIO_PHONE_NUMBER
                sync: false
              - key: TWILIO_WHATSAPP_NUMBER
                sync: false
              - key: TWILIO_WHATSAPP_CONTENT_SID
                sync: false
              - key: TWILIO_WHATSAPP_WEBHOOK_URL
                sync: false
              - key: TWILIO_SMS_WEBHOOK_URL
                sync: false
              - key: TWILIO_VOICE_WEBHOOK_URL
                sync: false
              - key: TWILIO_VOICE_ACTION_URL
                sync: false
              - key: TWILIO_STATUS_WEBHOOK_URL
                sync: false
              - key: TWILIO_STATUS_CALLBACK_URL
                sync: false
              - key: RYANAI_TWILIO_VOICE
                sync: false

              # Resend — inbound email.
              - key: RESEND_API_KEY
                sync: false
              - key: RESEND_WEBHOOK_SECRET
                sync: false

              # SMTP — configure the port and TLS mode as a matching pair.
              # For example, 465 normally uses secure=true; 587 normally uses
              # STARTTLS with secure=false. Leave these operator-supplied.
              - key: SMTP_HOST
                sync: false
              - key: SMTP_PORT
                sync: false
              - key: SMTP_SECURE
                sync: false
              - key: SMTP_USER
                sync: false
              - key: SMTP_PASS
                sync: false
              - key: SMTP_FROM
                sync: false

              # Sir G owner preferences; personal destinations stay private.
              - key: RYANAI_OWNER_TITLE
                value: Sir G
              - key: RYANAI_OWNER_LANGUAGE
                value: ve-ZA
              - key: RYANAI_OWNER_PHONE
                sync: false
              - key: RYANAI_OWNER_EMAIL
                sync: false

              # Optional startup backup is deliberately disabled by default.
              - key: BACKUP_ON_STARTUP
                value: "false"

          # Redis backs distributed request-rate tracking and short-lived session tickets.
          # Prefer rejecting writes at the memory ceiling over evicting live rate-limit keys.
          # Keep persistent task/billing state in PostgreSQL; this free KV has no disk persistence.
          # Existing managed Redis Key Value resource; internal-only allow list.
          - type: keyvalue
            name: ryanai-redis
            plan: free
            region: oregon
            maxmemoryPolicy: noeviction
            ipAllowList: []
